<body>
<title>Speak Japanese</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: single-column study app; JR station-sign header for the week, a rail line as the progress map, fixed bottom tab bar */
:root{
  --paper:#f3f5f2; --card:#ffffff; --ink:#1c2128; --muted:#5b6570; --line:#d8ddd6;
  --ai:#2b4e85; --ai-soft:#e3eaf5; --rail:#3a9447; --rail-soft:#e2f1e3; --warn:#b4472c;
  --jp:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#13161b; --card:#1b2027; --ink:#e7eaee; --muted:#9aa4af; --line:#2c333c;
  --ai:#93b3ea; --ai-soft:#1f2b40; --rail:#6cc477; --rail-soft:#1c3020; --warn:#f08b6f; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#13161b; --card:#1b2027; --ink:#e7eaee; --muted:#9aa4af; --line:#2c333c;
  --ai:#93b3ea; --ai-soft:#1f2b40; --rail:#6cc477; --rail-soft:#1c3020; --warn:#f08b6f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:16px/1.5 var(--body);padding-inline:16px;padding-block:16px calc(84px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--jp);text-wrap:balance;margin:0;line-height:1.25}
h2{font-size:1.35rem}
h3{font-size:1.05rem}
p{margin:0}
.jp{font-family:var(--jp)}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.label{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 14px;font-weight:600}
.btn.primary{background:var(--ai);border-color:var(--ai);color:var(--card)}
.btn.rail{background:var(--rail);border-color:var(--rail);color:var(--card)}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 12px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ai);color:var(--card)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-weight:600;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
select,input[type=text]{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 10px;max-width:100%;min-width:0}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field input,.field select{width:100%}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:460px){.grid2{grid-template-columns:1fr}}

/* station sign */
.sign{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sign-top{padding:16px 16px 12px;text-align:center}
.sign-top .kanji{font-family:var(--jp);font-weight:700;font-size:2rem;letter-spacing:.06em}
.sign-top .roma{font-weight:600;font-size:1.05rem}
.sign-band{background:var(--rail);color:var(--card);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;font-weight:600;font-size:.85rem;padding:6px 12px;gap:8px}
.sign-band .num{background:var(--card);color:var(--rail);border-radius:6px;padding:1px 8px;font-variant-numeric:tabular-nums}
.sign-band .r{text-align:right}
.sign-band button{background:none;border:0;color:inherit;font:inherit;padding:4px 0;cursor:pointer;text-align:left;min-width:0;line-height:1.2}
.sign-band button.num{background:var(--card);color:var(--rail);padding:1px 8px}
.sign-band button.r{text-align:right}
.sign-band button:disabled{visibility:hidden}
.sign-top{cursor:pointer}
.railmap [data-goweek]{cursor:pointer}
button.link{background:none;border:0;padding:0;margin:0;color:var(--ai);text-decoration:underline;text-underline-offset:2px;font:inherit;cursor:pointer;text-align:left;display:inline}
a.link{color:var(--ai)}
.cat{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.cat li{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.cat li:first-child{border-top:0}
.cat .dn{font-family:var(--jp);font-weight:700;color:var(--ai);font-variant-numeric:tabular-nums}
.cat li.now{background:var(--rail-soft);margin:0 -8px;padding:8px;border-radius:8px;border-top:0}
.cat li.now+li{border-top:0}
.cat li.focus{outline:2px solid var(--ai);outline-offset:-2px;border-radius:8px}
.cat .st{font-size:.8rem;color:var(--muted)}
.cat .st.done{color:var(--rail);font-weight:600}
.sched[data-goweek]{cursor:pointer}
.hints li[data-stage]{cursor:pointer}
.hints li[data-stage]:hover b{text-decoration:underline}
.railmap{overflow-x:auto}
.railmap svg{display:block;min-width:520px;width:100%;height:auto}
.countdown{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.countdown b{font-family:var(--jp);font-size:2.2rem;font-variant-numeric:tabular-nums;color:var(--ai)}

/* steps */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.step{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:start;padding:12px;border:1px solid var(--line);border-radius:8px}
.step .min{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ai);text-align:center;background:var(--ai-soft);border-radius:6px;padding:4px 0;font-size:.85rem}
.step .body{display:flex;flex-direction:column;gap:6px;min-width:0}
.done-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* phrases */
.phrases{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.phrase{display:grid;grid-template-columns:40px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.phrase:first-child{border-top:0}
.parts{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.part{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;align-items:center;line-height:1.2;min-width:0;font:inherit}
.part .ro{font-weight:700;color:var(--ai);font-size:1rem}
.part .r{font-size:.72rem;color:var(--muted)}
.part.on{border-color:var(--rail);background:var(--rail-soft)}
.phrase .parts{grid-column:2;justify-content:flex-start;margin-top:-2px}
.phrase .part{padding:3px 7px}
.phrase .part .ro{font-size:.85rem}
.nosound{text-align:left}
.opts{display:flex;flex-direction:column;gap:8px;width:100%}
.opt{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px 14px;font:inherit;font-weight:600;text-align:left;width:100%;line-height:1.3}
.opt .sub{display:block;font-weight:400;font-size:.8rem;color:var(--muted)}
.opt.ok{border-color:var(--rail);background:var(--rail-soft)}
.opt.bad{border-color:var(--warn);background:var(--card);opacity:.85}
.opt:disabled{cursor:default}
.pair{font-size:1.05rem;text-align:center}
.pair b{color:var(--ai)}
.hook{font-size:.85rem;color:var(--muted);font-style:italic;text-align:center;max-width:36ch}
#errbox{position:fixed;left:8px;right:8px;top:8px;z-index:9;background:#fff3f0;border:1px solid var(--warn);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:.85rem;display:flex;flex-direction:column;gap:6px;box-shadow:0 4px 16px rgba(0,0,0,.12)}
#errbox .row{gap:6px}
#errbox .btn{padding:4px 10px;font-size:.8rem}
.nosound summary{cursor:pointer;color:var(--muted)}
.nosound .note{margin-top:8px}
.nosound ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.ro{font-weight:600;font-size:1.1rem;line-height:1.3}
.jpw{font-family:var(--jp);font-size:.95rem;color:var(--muted)}
.nojp .jpw{display:none}
.swap{background:var(--rail-soft);border-radius:4px;padding:0 3px}
.say{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none}
.say svg{width:16px;height:16px;fill:var(--ai)}
.say.on{background:var(--ai)}
.say.on svg{fill:var(--card)}
.note{background:var(--ai-soft);border-radius:8px;padding:12px;font-size:.95rem}
.dlg{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.dlg li{display:grid;grid-template-columns:28px 1fr 36px;gap:10px;align-items:start}
.who{font-weight:700;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;background:var(--line)}
.who.B{background:var(--rail);color:var(--card)}
.dlg li.active .ro{color:var(--ai)}
.hide-en .en{display:none}
.prompts{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.words{display:flex;flex-wrap:wrap;gap:6px}
.word{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;align-items:flex-start;line-height:1.2;min-width:0}
.word .r{font-size:.75rem;color:var(--muted)}
.pat{display:grid;grid-template-columns:1fr;gap:2px;padding:8px 0;border-top:1px solid var(--line)}
.pat:first-child{border-top:0}
.pat .jp{font-size:1.1rem}

/* stage (audio drills) */
.stage{text-align:center;padding:24px 12px;display:flex;flex-direction:column;gap:8px;align-items:center;min-height:220px;justify-content:center}
.stage .en{font-size:1.15rem}
.stage .ro{font-size:1.5rem;font-weight:700;color:var(--ai)}
.stage .jpw{font-size:1rem}
.stage .ans{border-top:1px solid var(--line);width:100%;padding-top:10px;display:flex;flex-direction:column;gap:4px;align-items:center}
.phase{font-weight:700;color:var(--rail)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;width:100%}
.bar i{display:block;height:100%;background:var(--rail);width:0}
.ctl{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
input[type=range]{width:100%;accent-color:var(--ai)}

/* cards */
.flash{min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.flash .big{font-size:1.5rem;font-weight:700}
.boxes{display:flex;gap:4px}
.boxes i{width:10px;height:10px;border-radius:2px;background:var(--line)}
.boxes i.f{background:var(--rail)}

.warnbox{border:1px solid var(--warn);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:.9rem}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs button{border:0;background:transparent;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;font-weight:600;color:var(--muted)}
nav.tabs button .g{font-family:var(--jp);font-size:1.15rem;line-height:1.2}
nav.tabs button[aria-selected="true"]{color:var(--ai)}

/* session player */
.player{display:flex;flex-direction:column;gap:14px}
.player .head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.player .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--paper);padding-block:8px}
.bigbtn{font-size:1.1rem;padding:14px 18px;width:100%}
.prompt{font-size:1.35rem;font-weight:700;text-align:center;padding:18px 8px;font-family:var(--jp)}
.hints{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hints li{display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.hints li:first-child{border-top:0}
.donebadge{color:var(--rail);font-weight:700}
.quizk{font-family:var(--body);font-size:3.5rem;font-weight:700;text-align:center;line-height:1.1;font-variant-numeric:tabular-nums}
/* planner, chat, translator */
.nudge{background:var(--ai-soft);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px}
.nudge.warn{background:var(--card);border:1px solid var(--warn)}
.status{font-weight:600}
.status.bad{color:var(--warn)}
.status.good{color:var(--rail)}
.toast{background:var(--rail-soft);border:1px solid var(--rail);border-radius:8px;padding:10px 12px}
.rate{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rate .btn{padding:10px 6px;font-size:.9rem;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.2}
.rate .btn small{font-weight:400;opacity:.8;font-size:.75rem}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.check:first-child{border-top:0}
.check input{margin-top:4px;accent-color:var(--rail);width:18px;height:18px;flex:none}
.chat{display:flex;flex-direction:column;gap:8px;max-height:55vh;overflow:auto;padding:2px}
.bub{max-width:88%;padding:10px 12px;border-radius:12px;background:var(--ai-soft);display:flex;flex-direction:column;gap:3px;min-width:0}
.bub.me{align-self:flex-end;background:var(--rail-soft)}
.verdict{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:700;align-self:flex-start}
.verdict.good{background:var(--rail);color:var(--card)}
.verdict.ok{background:var(--card);color:var(--ai);border:1px solid var(--ai)}
.verdict.retry{background:var(--card);border:1px solid var(--warn);color:var(--warn)}
textarea{font:inherit;color:inherit;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 10px;width:100%;min-height:64px;resize:vertical}
.result{display:grid;grid-template-columns:1fr 36px;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.result:first-child{border-top:0}
.result .ro{color:var(--ai)}
.sched{display:grid;grid-template-columns:44px 1fr auto;gap:6px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.sched:first-child{border-top:0}
.sched .wk{font-family:var(--jp);font-weight:700;color:var(--ai);font-variant-numeric:tabular-nums}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--rail)}
input[type=time]{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 10px}
.upnext{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.upnext li{display:flex;gap:8px;align-items:baseline}
.upnext .d{font-variant-numeric:tabular-nums;color:var(--muted);min-width:4.5em;font-size:.85rem}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

// phrase: [romaji, japanese, english]; words in [brackets] are swappable examples
const WEEKS = [
 {kanji:"挨拶", title:"Greetings and politeness", goal:"Be polite in every situation and handle not understanding.",
  phrases:[
   ["Ohayou gozaimasu","おはようございます","Good morning"],
   ["Konnichiwa","こんにちは","Hello / Good afternoon"],
   ["Konbanwa","こんばんは","Good evening"],
   ["Arigatou gozaimasu","ありがとうございます","Thank you"],
   ["Sumimasen","すみません","Excuse me / Sorry"],
   ["Hai / Iie","はい / いいえ","Yes / No"],
   ["Onegaishimasu","お願いします","Please (when asking for something)"],
   ["Daijoubu desu","大丈夫です","I'm fine / No thank you"],
   ["Wakarimasen","分かりません","I don't understand"],
   ["Mou ichido onegaishimasu","もう一度お願いします","Once more, please"],
   ["Yukkuri onegaishimasu","ゆっくりお願いします","Slowly, please"]],
  note:"Sumimasen is the most useful word in Japan: it gets attention, apologizes and thanks. Daijoubu desu with a small hand wave is the polite no thanks. When a clerk says Irasshaimase (welcome), a nod is enough. Sounds: every syllable gets equal weight and there is no stress. A doubled vowel is held longer (Toukyou is to-o-kyo-o), a small っ is a tiny pause before the next consonant (kitte), and r is a light tap between English r and l.",
  patterns:[{en:"{x}, please",ro:"{x}, onegaishimasu",jp:"{x}、お願いします",x:"ask"},{en:"Excuse me, {x} please",ro:"Sumimasen, {x} onegaishimasu",jp:"すみません、{x}お願いします",x:"ask"}],
  dialogue:[
   ["A","おはようございます！","Ohayou gozaimasu!","Good morning!"],
   ["B","おはようございます。","Ohayou gozaimasu.","Good morning."],
   ["A","大丈夫ですか？","Daijoubu desu ka?","Is everything OK?"],
   ["B","すみません、分かりません。ゆっくりお願いします。","Sumimasen, wakarimasen. Yukkuri onegaishimasu.","Sorry, I don't understand. Slowly, please."],
   ["A","大丈夫…ですか？","Daijoubu… desu ka?","Is… everything… OK?"],
   ["B","はい、大丈夫です。ありがとうございます。","Hai, daijoubu desu. Arigatou gozaimasu.","Yes, I'm fine. Thank you."]],


  scene:"Morning at the hotel",
  speak:["Greet someone at 8am, 2pm and 7pm.","Get a stranger's attention, then thank them.","Ask someone to repeat slowly."]},
 {kanji:"自己紹介", title:"Introducing yourself", goal:"Say who you are, where you're from and why you're here.",
  phrases:[
   ["Hajimemashite","はじめまして","Nice to meet you (first time)"],
   ["Watashi wa [Sam] desu","私は[サム]です","I'm [Sam]"],
   ["Amerika kara kimashita","アメリカから来ました","I'm from America"],
   ["[Koroorado] ni sunde imasu","[コロラド]に住んでいます","I live in [Colorado]"],
   ["Shigoto wa [enjinia] desu","仕事は[エンジニア]です","My job is [engineer]"],
   ["Ryokou de kimashita","旅行で来ました","I came for a trip"],
   ["Yoroshiku onegaishimasu","よろしくお願いします","Pleased to meet you"],
   ["Onamae wa?","お名前は？","What's your name?"],
   ["Nihongo wa sukoshi dake desu","日本語は少しだけです","I only speak a little Japanese"],
   ["Eigo o hanasemasu ka?","英語を話せますか？","Do you speak English?"]],
  note:"Numbers 1 to 10: ichi, ni, san, yon, go, roku, nana, hachi, kyuu, juu. Build the rest: 11 is juu-ichi, 20 is ni-juu, 35 is san-juu-go. Wa marks the topic and desu means is or am, so Watashi wa Sam desu is literally 'As for me, Sam is.' Fill in Your answers (Practice → Talk) so every drill uses your real name, hometown and job.",
  patterns:[{en:"I'm from {x}",ro:"{x} kara kimashita",jp:"{x}から来ました",x:"origin"},{en:"My job is {x}",ro:"Shigoto wa {x} desu",jp:"仕事は{x}です",x:"job"},{en:"I live in {x}",ro:"{x} ni sunde imasu",jp:"{x}に住んでいます",x:"origin"}],
  dialogue:[
   ["A","こんばんは。旅行ですか？","Konbanwa. Ryokou desu ka?","Good evening. Are you traveling?"],
   ["B","はい、旅行で来ました。","Hai, ryokou de kimashita.","Yes, I came for a trip."],
   ["A","お名前は？","Onamae wa?","What's your name?"],
   ["B","{name}です。はじめまして。","{name} desu. Hajimemashite.","I'm {name}. Nice to meet you."],
   ["A","はじめまして。ケンです。よろしくお願いします。","Hajimemashite. Ken desu. Yoroshiku onegaishimasu.","Nice to meet you. I'm Ken."],
   ["B","よろしくお願いします。アメリカから来ました。日本語は少しだけです。","Yoroshiku onegaishimasu. Amerika kara kimashita. Nihongo wa sukoshi dake desu.","Pleased to meet you. I'm from America. I only speak a little Japanese."]],


  scene:"Chatting with your neighbor at a bar",
  speak:["Introduce yourself in four sentences: name, from, job, why you're here.","Count from 1 to 20 out loud.","Ask someone's name, then say yours."],
  drill:"numbers"},
 {kanji:"食事", title:"Food and ordering", goal:"Get seated, order, ask questions about the menu and pay.",
  phrases:[
   ["[Raamen] o kudasai","[ラーメン]をください","[Ramen], please"],
   ["[Biiru] o futatsu kudasai","[ビール]を二つください","Two [beers], please"],
   ["Futari desu","二人です","Two people (party size)"],
   ["Eigo no menyuu wa arimasu ka?","英語のメニューはありますか？","Do you have an English menu?"],
   ["Osusume wa nan desu ka?","おすすめは何ですか？","What do you recommend?"],
   ["Kore wa nan desu ka?","これは何ですか？","What is this?"],
   ["Mizu o kudasai","水をください","Water, please"],
   ["Itadakimasu","いただきます","Said before eating"],
   ["Totemo oishii desu!","とてもおいしいです！","It's very delicious!"],
   ["Okaikei onegaishimasu","お会計お願いします","The check, please"],
   ["Gochisousama deshita","ごちそうさまでした","Thanks for the meal (when leaving)"],
   ["[Ebi] wa taberaremasen","[えび]は食べられません","I can't eat [shrimp]"],
   ["Atatamete kudasai","温めてください","Please heat it up (convenience store)"]],
  note:"Counting things: hitotsu, futatsu, mittsu, yottsu, itsutsu (1 to 5). Counting people: hitori, futari, sannin. Hold up fingers as you say it. There is no tipping in Japan; you usually pay at the register by the door.",
  patterns:[{en:"{x}, please",ro:"{x} o kudasai",jp:"{x}をください",x:"food"},{en:"{y} {x}, please",ro:"{x} o {y} kudasai",jp:"{x}を{y}ください",x:"drink",y:"count"},{en:"Do you have {x}?",ro:"{x} wa arimasu ka?",jp:"{x}はありますか？",x:"food"}],
  dialogue:[
   ["A","こんばんは。二人ですか？","Konbanwa. Futari desu ka?","Good evening. Two people?"],
   ["B","はい、二人です。英語のメニューはありますか？","Hai, futari desu. Eigo no menyuu wa arimasu ka?","Yes, two. Do you have an English menu?"],
   ["A","はい。","Hai.","Yes."],
   ["B","おすすめは何ですか？","Osusume wa nan desu ka?","What do you recommend?"],
   ["A","ラーメンです。","Raamen desu.","The ramen."],
   ["B","ラーメンを二つください。水もお願いします。","Raamen o futatsu kudasai. Mizu mo onegaishimasu.","Two ramen, please. Water too, please."],
   ["B","とてもおいしいです！お会計お願いします。","Totemo oishii desu! Okaikei onegaishimasu.","It's very good! The check, please."],
   ["A","ありがとうございます。","Arigatou gozaimasu.","Thank you."],
   ["B","ごちそうさまでした。","Gochisousama deshita.","Thanks for the meal."]],


  scene:"Ordering at a ramen shop",
  speak:["Order two dishes and a drink for your table.","Ask what something on the menu is.","Ask for the check and thank the staff on the way out."]},
 {kanji:"買物", title:"Shopping and prices", goal:"Ask prices, sizes and pay by card.",
  phrases:[
   ["Ikura desu ka?","いくらですか？","How much is it?"],
   ["Kore o kudasai","これをください","I'll take this"],
   ["Kore / Sore / Are","これ / それ / あれ","This / That (near you) / That over there"],
   ["Miteru dake desu","見てるだけです","I'm just looking"],
   ["Motto ookii no wa arimasu ka?","もっと大きいのはありますか？","Do you have a bigger one?"],
   ["Motto chiisai no wa arimasu ka?","もっと小さいのはありますか？","Do you have a smaller one?"],
   ["[Kuro] wa arimasu ka?","[黒]はありますか？","Do you have it in [black]?"],
   ["Shichaku shite mo ii desu ka?","試着してもいいですか？","May I try it on?"],
   ["Kaado de ii desu ka?","カードでいいですか？","Is a card OK?"],
   ["Menzei dekimasu ka?","免税できますか？","Can I buy this tax-free?"]],
  note:"Big numbers: hyaku is 100, sen is 1,000, man is 10,000. So 1,500 yen is sen gohyaku en and 10,000 yen is ichi-man en (one ten-thousand). Watch the sound changes: sanbyaku (300), roppyaku (600), happyaku (800), sanzen (3,000), hassen (8,000).",
  patterns:[{en:"How much is {x}?",ro:"{x} wa ikura desu ka?",jp:"{x}はいくらですか？",x:"thing"},{en:"Do you have it in {x}?",ro:"{x} wa arimasu ka?",jp:"{x}はありますか？",x:"color"},{en:"Do you have a {x} one?",ro:"Motto {x} no wa arimasu ka?",jp:"もっと{x}のはありますか？",x:"size"}],
  dialogue:[
   ["A","こんにちは。","Konnichiwa.","Hello."],
   ["B","こんにちは。見てるだけです。","Konnichiwa. Miteru dake desu.","Hello. I'm just looking."],
   ["B","すみません、これはいくらですか？","Sumimasen, kore wa ikura desu ka?","Excuse me, how much is this?"],
   ["A","三千円です。","Sanzen en desu.","It's 3,000 yen."],
   ["B","もっと大きいのはありますか？","Motto ookii no wa arimasu ka?","Do you have a bigger one?"],
   ["A","はい、これです。","Hai, kore desu.","Yes, this one."],
   ["B","試着してもいいですか？","Shichaku shite mo ii desu ka?","May I try it on?"],
   ["A","はい、大丈夫です。","Hai, daijoubu desu.","Yes, that's fine."],
   ["B","これをください。カードでいいですか？","Kore o kudasai. Kaado de ii desu ka?","I'll take this. Is a card OK?"],
   ["A","はい、大丈夫です。","Hai, daijoubu desu.","Yes, that's fine."]],


  scene:"Buying a sweater in a department store",
  speak:["Ask the price of three things and say each price back.","Ask for a different size and color.","Tell a clerk you're just looking."],
  drill:"prices"},
 {kanji:"道案内", title:"Directions and trains", goal:"Find places, follow simple directions, take the right train.",
  phrases:[
   ["[Eki] wa doko desu ka?","[駅]はどこですか？","Where is the [station]?"],
   ["Toire wa doko desu ka?","トイレはどこですか？","Where is the restroom?"],
   ["Kono densha wa [Shibuya] ni ikimasu ka?","この電車は[渋谷]に行きますか？","Does this train go to [Shibuya]?"],
   ["Nan-ban sen desu ka?","何番線ですか？","Which platform number?"],
   ["Massugu","まっすぐ","Straight ahead"],
   ["Migi / Hidari","右 / 左","Right / Left"],
   ["Chikai desu ka?","近いですか？","Is it close?"],
   ["Deguchi / Iriguchi","出口 / 入口","Exit / Entrance"],
   ["Chizu de oshiete kudasai","地図で教えてください","Please show me on the map"],
   ["[Hoteru] made onegaishimasu","[ホテル]までお願いします","To the [hotel], please (taxi)"],
   ["Tsugi wa [Shinjuku] desu ka?","次は[新宿]ですか？","Is the next stop [Shinjuku]?"]],
  note:"Answers come fast. Listen for just three words: massugu, migi, hidari, and watch where the person points. Then hand them your phone map and say Chizu de oshiete kudasai. Platform numbers use ban-sen: 3-ban sen is platform 3.",
  patterns:[{en:"Where is the {x}?",ro:"{x} wa doko desu ka?",jp:"{x}はどこですか？",x:"place"},{en:"Does this train go to {x}?",ro:"Kono densha wa {x} ni ikimasu ka?",jp:"この電車は{x}に行きますか？",x:"city"},{en:"To the {x}, please (taxi)",ro:"{x} made onegaishimasu",jp:"{x}までお願いします",x:"place"}],
  dialogue:[
   ["B","すみません、駅はどこですか？","Sumimasen, eki wa doko desu ka?","Excuse me, where is the station?"],
   ["A","まっすぐ。右です。","Massugu. Migi desu.","Straight ahead. Then right."],
   ["B","近いですか？","Chikai desu ka?","Is it close?"],
   ["A","はい、近いです。","Hai, chikai desu.","Yes, it's close."],
   ["B","ありがとうございます。この電車は渋谷に行きますか？","Arigatou gozaimasu. Kono densha wa Shibuya ni ikimasu ka?","Thanks. Does this train go to Shibuya?"],
   ["A","いいえ。三番線です。","Iie. San-ban sen desu.","No. It's platform 3."]],

  scene:"Lost near a train station",
  speak:["Ask for three places: station, restroom, your hotel.","Give directions to someone: straight, then left.","Tell a taxi driver where to go."]},
 {kanji:"予定", title:"Time, days and plans", goal:"Talk about when things happen and what you want to do.",
  phrases:[
   ["Nan-ji desu ka?","何時ですか？","What time is it?"],
   ["[Ku]-ji ni","[九]時に","At [9] o'clock"],
   ["Kyou / Ashita / Kinou","今日 / 明日 / 昨日","Today / Tomorrow / Yesterday"],
   ["Ashita [Kyouto] ni ikimasu","明日[京都]に行きます","Tomorrow I'm going to [Kyoto]"],
   ["Nichiyoubi ni [Nara] ni ikimasu","日曜日に[奈良]に行きます","On Sunday I'm going to [Nara]"],
   ["[Kyouto] ni ikitai desu","[京都]に行きたいです","I want to go to [Kyoto]"],
   ["[Otera] ga mitai desu","[お寺]が見たいです","I want to see [temples]"],
   ["Nan-ji ni akimasu ka?","何時に開きますか？","What time does it open?"],
   ["Nan-ji made desu ka?","何時までですか？","Until what time?"],
   ["Yoyaku shite imasu","予約しています","I have a reservation"],
   ["Kyou wa nani o shimasu ka?","今日は何をしますか？","What are you doing today?"]],
  note:"Verbs ending in -masu mean do or will do: ikimasu (go), mimasu (see), tabemasu (eat). Swap -masu for -tai desu to say want to: ikitai desu, mitai desu. For time, add ji to the number; half past is han. Odd ones: yo-ji (4), shichi-ji (7), ku-ji (9). Days end in -youbi: getsu (Mon), ka (Tue), sui (Wed), moku (Thu), kin (Fri), do (Sat), nichi (Sun).",
  patterns:[{en:"Tomorrow I'm going to {x}",ro:"Ashita {x} ni ikimasu",jp:"明日{x}に行きます",x:"city"},{en:"I want to go to {x}",ro:"{x} ni ikitai desu",jp:"{x}に行きたいです",x:"city"},{en:"I want to see {x}",ro:"{x} ga mitai desu",jp:"{x}が見たいです",x:"sight"},{en:"I'm going at {x}",ro:"{x} ni ikimasu",jp:"{x}に行きます",x:"hour"},{en:"On {x} I'm going to {y}",ro:"{x} ni {y} ni ikimasu",jp:"{x}に{y}に行きます",x:"day",y:"city"}],
  dialogue:[
   ["A","明日は何をしますか？","Ashita wa nani o shimasu ka?","What are you doing tomorrow?"],
   ["B","京都に行きたいです。お寺が見たいです。","Kyouto ni ikitai desu. Otera ga mitai desu.","I want to go to Kyoto. I want to see temples."],
   ["A","何時に行きますか？","Nan-ji ni ikimasu ka?","What time are you going?"],
   ["B","九時に行きます。何時に開きますか？","Ku-ji ni ikimasu. Nan-ji ni akimasu ka?","At nine. What time does it open?"],
   ["A","九時です。","Ku-ji desu.","Nine."]],


  scene:"Telling a hotel clerk your plans",
  speak:["Say three things you want to do in Japan.","Ask what time a museum opens and closes.","Describe tomorrow's plan with times."],
  drill:"time"},
 {kanji:"雑談", title:"Small talk and likes", goal:"Keep a friendly conversation going and ask questions back.",
  phrases:[
   ["[Raamen] ga suki desu","[ラーメン]が好きです","I like [ramen]"],
   ["[Sushi] wa suki desu ka?","[寿司]は好きですか？","Do you like [sushi]?"],
   ["Nani ga suki desu ka?","何が好きですか？","What do you like?"],
   ["Shumi wa [haikingu] desu","趣味は[ハイキング]です","My hobby is [hiking]"],
   ["[Ken]-san wa?","[ケン]さんは？","And you, [Ken]?"],
   ["Samui desu ne","寒いですね","It's cold, isn't it?"],
   ["Kirei desu ne","きれいですね","It's beautiful, isn't it?"],
   ["Nihon wa hajimete desu","日本は初めてです","It's my first time in Japan"],
   ["Hontou desu ka?","本当ですか？","Really?"],
   ["Sou desu ne","そうですね","That's right / Let me think"],
   ["Watashi mo","私も","Me too"],

/* ---------- dates ---------- */
const START=new Date(2026,9,5), TRIP=new Date(2026,11,17);
const DAYNAMES=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
function mid(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function dayDiff(a,b){return Math.round((mid(b)-mid(a))/864e5)}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fmt(d){return d.toLocaleDateString("en-US",{month:"short",day:"numeric"})}
function weekRange(w){const a=new Date(START);a.setDate(a.getDate()+w*7);const b=new Date(a);b.setDate(b.getDate()+6);return fmt(a)+" – "+fmt(b)}
function infoFor(date){const di=dayDiff(START,date),toTrip=dayDiff(date,TRIP);
  if(di<0)return{mode:"pre",week:0,day:0,toTrip};
  if(toTrip<=0)return{mode:"trip",week:9,day:6,toTrip};
  if(di>=70)return{mode:"final",week:9,day:di-70,toTrip};
  return{mode:"study",week:Math.floor(di/7),day:di%7,toTrip}}

/* ---------- errors: show them instead of failing silently ---------- */
function showError(e,where){try{const msg=(e&&e.message)||String(e),rec={msg,where:where||"",stack:((e&&e.stack)||"").split("\n").slice(0,4).join(" | "),at:new Date().toISOString(),build:typeof BUILD==="string"?BUILD:"?"};
  store.set("lastError",rec);let box=document.getElementById("errbox");if(!box){box=document.createElement("div");box.id="errbox";box.setAttribute("role","alert");document.body.appendChild(box)}
  box.innerHTML=`<div><b>Something went wrong${where?" in "+where:""}.</b> ${msg}</div><div class="row"><button class="btn" id="err-copy">Copy details</button><button class="btn" id="err-x">Dismiss</button><span class="small">Paste this into Feedback or #app-feedback.</span></div>`;
  const text=`${rec.where}: ${rec.msg} (build ${rec.build}, ${rec.at})\n${rec.stack}`;box.querySelector("#err-copy").onclick=()=>{const b=box.querySelector("#err-copy");try{navigator.clipboard.writeText(text).then(()=>b.textContent="Copied",()=>b.textContent=text)}catch(x){b.textContent=text}};
  box.querySelector("#err-x").onclick=()=>box.remove()}catch(x){}}
window.addEventListener("error",ev=>showError(ev.error||ev.message,""));window.addEventListener("unhandledrejection",ev=>showError(ev.reason,""));

const KT={a:"ア",i:"イ",u:"ウ",e:"エ",o:"オ",ka:"カ",ki:"キ",ku:"ク",ke:"ケ",ko:"コ",sa:"サ",shi:"シ",su:"ス",se:"セ",so:"ソ",ta:"タ",chi:"チ",tsu:"ツ",te:"テ",to:"ト",na:"ナ",ni:"ニ",nu:"ヌ",ne:"ネ",no:"ノ",ha:"ハ",hi:"ヒ",fu:"フ",hu:"フ",he:"ヘ",ho:"ホ",ma:"マ",mi:"ミ",mu:"ム",me:"メ",mo:"モ",ya:"ヤ",yu:"ユ",yo:"ヨ",ye:"イェ",yi:"イ",ra:"ラ",ri:"リ",ru:"ル",re:"レ",ro:"ロ",wa:"ワ",wi:"ウィ",wu:"ウ",we:"ウェ",wo:"ウォ",ga:"ガ",gi:"ギ",gu:"グ",ge:"ゲ",go:"ゴ",za:"ザ",ji:"ジ",zu:"ズ",ze:"ゼ",zo:"ゾ",zi:"ズィ",da:"ダ",di:"ディ",du:"ドゥ",de:"デ",do:"ド",ba:"バ",bi:"ビ",bu:"ブ",be:"ベ",bo:"ボ",pa:"パ",pi:"ピ",pu:"プ",pe:"ペ",po:"ポ",sha:"シャ",shu:"シュ",she:"シェ",sho:"ショ",cha:"チャ",chu:"チュ",che:"チェ",cho:"チョ",ja:"ジャ",ju:"ジュ",je:"ジェ",jo:"ジョ",fa:"ファ",fi:"フィ",fe:"フェ",fo:"フォ",ti:"ティ",tu:"トゥ",si:"スィ",kya:"キャ",kyu:"キュ",kyo:"キョ",gya:"ギャ",gyu:"ギュ",gyo:"ギョ",nya:"ニャ",nyu:"ニュ",nyo:"ニョ",hya:"ヒャ",hyu:"ヒュ",hyo:"ヒョ",mya:"ミャ",myu:"ミュ",myo:"ミョ",rya:"リャ",ryu:"リュ",ryo:"リョ",bya:"ビャ",byu:"ビュ",byo:"ビョ",pya:"ピャ",pyu:"ピュ",pyo:"ピョ"};
function kata(s){const V="aiueo";
  s=s.toLowerCase().replace(/[^a-z\s-]/g,"").replace(/ee|ey|ie/g,"ii").replace(/oo/g,"uu").replace(/ay/g,"ei")
   .replace(/l/g,"r").replace(/v/g,"b").replace(/ph/g,"f").replace(/th/g,"s").replace(/ck/g,"kk")
   .replace(/ch(?![aiueo])/g,"k").replace(/c(?!h)(?=[ei])/g,"s").replace(/c(?!h)/g,"k").replace(/q/g,"k").replace(/x/g,"kus").replace(/y(?![aiueo])/g,"i");
  let out="",i=0;
  while(i<s.length){const c=s[i];
    if(c===" "||c==="-"){out+="・";i++;continue}
    if(V.includes(c)){if(i>0&&s[i-1]===c){out+="ー"}else out+=KT[c];i++;continue}
    const nx=s[i+1]||"";
    if(c==="n"&&!(nx&&V.includes(nx))&&nx!=="y"){out+="ン";i++;continue}
    if(nx===c&&c!=="n"){out+="ッ";i++;continue}
    let m=null;for(const len of [3,2]){const seg=s.substr(i,len);if(KT[seg]&&V.includes(seg[seg.length-1])){m=seg;break}}
    if(m){out+=KT[m];i+=m.length;continue}
    let cons=c;const two=s.substr(i,2);if(["sh","ch","ts"].includes(two))cons=two;
    const def=(cons==="t"||cons==="d")?"o":(cons==="ch"||cons==="sh"||cons==="j")?"i":"u";
    out+=KT[cons+def]||KT[cons+"u"]||"";i+=cons.length}
  return out.replace(/ンン$/,"ン").replace(/・$/,"")}

/* ---------- planner ----------
   The course is a queue of 73 sessions (10 weeks × 7 days + 3 buffer days). You work through the queue
   one session a day; the calendar only decides whether you are ahead or behind. */
function baseQueue(){const q=[];for(let w=0;w<10;w++)for(let d=0;d<7;d++)q.push({w,d,rep:0});for(let i=0;i<3;i++)q.push({w:9,d:7+i,rep:0});return q}
function loadPlan(){const p=store.get("plan",null);if(p&&p.queue&&typeof p.pos==="number")return p;const np={queue:baseQueue(),pos:0,log:[],focus:{},lastAdjust:null};store.set("plan",np);return np}
let PLAN=loadPlan();
function savePlan(){store.set("plan",PLAN)}
const skey=s=>s.w+"-"+s.d+(s.rep?"-r"+s.rep:"");
function sessionTitle(s){if(s.d>=7)return"Final review "+(s.d-6)+" of 3";return(s.rep?"Repeat · ":"")+WEEKS[s.w].title+" · day "+(s.d+1)}
function todayIso(){return iso(new Date())}
function daysLeft(){return Math.max(0,dayDiff(new Date(),TRIP))}
function remaining(){return PLAN.queue.length-PLAN.pos}
function daysAvail(){return daysLeft()-(doneToday()>0?1:0)}
function slackRaw(){return daysAvail()-remaining()}
function bufferLeft(){return PLAN.queue.filter((s,i)=>i>=PLAN.pos&&s.d>=7).length}
function spare(){return slackRaw()+bufferLeft()}
function useSpare(){if(slackRaw()>=1)return true;for(let i=PLAN.queue.length-1;i>=PLAN.pos;i--)if(PLAN.queue[i].d>=7){PLAN.queue.splice(i,1);return true}return false}
function current(){return PLAN.queue[PLAN.pos]||null}
function curWeek(){const c=current();return c?Math.min(9,c.w):9}
function doneToday(){const t=todayIso();return PLAN.log.filter(l=>l.date===t&&l.key!=="rest"&&!l.again).length}
function restedToday(){const t=todayIso();return PLAN.log.some(l=>l.date===t&&l.key==="rest")}
let extraSession=false;
function sessionsToday(){const base=Math.min(2,Math.max(1,Math.ceil((remaining()+doneToday())/Math.max(1,daysLeft()))));return extraSession?Math.max(base,doneToday()+1):base}
function lastActivity(){const l=PLAN.log[PLAN.log.length-1];return l?l.date:null}
function missedDays(){const la=lastActivity();const t=new Date();if(!la)return 0;const d=la.split("-").map(Number);return Math.max(0,dayDiff(new Date(d[0],d[1]-1,d[2]),t)-1)}
function rebalance(){let need=remaining()-daysAvail();if(need<=0||daysLeft()===0)return null;const what={buffer:0,repeat:0,sat:0,dbl:0};
  for(let i=PLAN.queue.length-1;i>=PLAN.pos&&need>0;i--)if(PLAN.queue[i].d>=7){PLAN.queue.splice(i,1);need--;what.buffer++}
  for(let i=PLAN.queue.length-1;i>=PLAN.pos&&need>0;i--)if(PLAN.queue[i].rep){PLAN.queue.splice(i,1);need--;what.repeat++}
  for(let i=PLAN.queue.length-1;i>PLAN.pos&&need>0;i--)if(PLAN.queue[i].d===5&&!PLAN.queue[i].rep){PLAN.queue.splice(i,1);need--;what.sat++}
  what.dbl=Math.max(0,need);const parts=[];
  if(what.buffer)parts.push(`used ${what.buffer} buffer day${what.buffer>1?"s":""} from the final week`);
  if(what.repeat)parts.push(`dropped ${what.repeat} planned repeat${what.repeat>1?"s":""}`);
  if(what.sat)parts.push(`dropped ${what.sat} Saturday drill session${what.sat>1?"s":""}`);
  if(what.dbl)parts.push(`the next ${what.dbl} day${what.dbl>1?"s":""} get two short sessions`);
  const text="Plan adjusted: "+parts.join(", ")+". You still finish before Dec 17.";PLAN.lastAdjust={date:todayIso(),text};savePlan();return text}
function finishSession(rating,checks){const s=current();if(!s)return"";PLAN.log.push({date:todayIso(),key:skey(s),w:s.w,d:s.d,rating});PLAN.pos++;let msg;
  const canRepeat=s.d<7&&!s.rep&&spare()>=1;
  if(checks){const ratio=checks.filter(Boolean).length/checks.length;
    if(ratio>=0.99)msg="Week "+(s.w+1)+" done. Everything checked, so straight on to the next week.";
    else if(ratio>=0.5)msg="Week "+(s.w+1)+" done. Moving on; this week's phrases get extra weight in your review.";
    else if(spare()>=2){useSpare();useSpare();PLAN.queue.splice(PLAN.pos,0,{w:s.w,d:2,rep:1},{w:s.w,d:3,rep:1});msg="Let's firm this up before moving on: the next two days repeat the dialogue and question sessions. You still finish before Dec 17."}
    else msg="No spare days left, so we move on. This week's phrases get extra weight in your review cards, and the questions keep coming back.";
    if(ratio<0.99)PLAN.focus[s.w]=true}
  else if(rating==="hard"){if(canRepeat){const usedBuffer=slackRaw()<1;useSpare();PLAN.queue.splice(PLAN.pos,0,{w:s.w,d:s.d,rep:1});msg="Tough one. Tomorrow repeats this session, then you carry on."+(usedBuffer?" That uses one of your buffer days; you still finish before Dec 17.":" You still finish before Dec 17.")}
    else{PLAN.focus[s.w]=true;msg=s.rep?"Moving on; a third pass rarely helps more than daily review. This week's phrases get extra weight in your cards.":"No spare days left, so we move on. This week's phrases get extra weight in your review cards."}}
  else if(rating==="easy")msg="Nice. Moving on."+(slackRaw()>=1?" You're ahead, so a rest day is fine any time.":"");
  else msg="Good. Moving on.";
  PLAN.pending={day:PLAN.pos,total:PLAN.queue.length,label:sessionTitle(s),rating,checks:!!checks,streak:streak(),pts:points(),left:daysLeft()};
  const n=current();savePlan();return msg+(n?" Next: "+sessionTitle(n)+".":" That was the last session. Have a great trip!")}
function restDay(){if(!useSpare())return false;PLAN.log.push({date:todayIso(),key:"rest"});savePlan();return true}
function logAgain(s){const n=PLAN.log.filter(l=>l.again&&l.w===s.w&&l.d===s.d).length+1;PLAN.log.push({date:todayIso(),key:skey(s)+"-x"+n,w:s.w,d:s.d,rating:"again",again:true});
  PLAN.pending={day:PLAN.pos,total:PLAN.queue.length,label:"revisit · "+sessionTitle(s),rating:"again",checks:false,streak:streak(),pts:points(),left:daysLeft()};savePlan();return"Logged as extra practice: +5 pts."}
function streak(){const set=new Set(PLAN.log.map(l=>l.date));let d=mid(new Date()),n=0;if(!set.has(iso(d)))d.setDate(d.getDate()-1);while(set.has(iso(d))){n++;d.setDate(d.getDate()-1)}return n}
const pd=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
function points(){let pts=0;PLAN.log.forEach(l=>{if(l.key==="rest")return;pts+=l.again?5:l.d===6?15:10});
  const days=[...new Set(PLAN.log.map(l=>l.date))].sort();let run=0,last=null;
  days.forEach(d=>{const dt=pd(d);run=(last&&dayDiff(last,dt)===1)?run+1:1;last=dt;pts+=({3:5,7:10,14:20,30:50})[run]||0});
  return pts+(PLAN.wins||0)*5}

function projectedDate(idx){let i=PLAN.pos-doneToday(),day=0,left=daysLeft();
  while(day<120){const remain=PLAN.queue.length-i;const cap=Math.min(2,Math.max(1,Math.ceil(remain/Math.max(1,left))));if(idx<i+cap)break;i+=cap;day++;left--}

  const warm=(ids,title,dir)=>ids.length?{kind:"warm",title,min:mins(ids.length*0.2),ids,dir:dir||"say"}:null;

   case 0:st=[w>0?warm(takeSome(partIds(w-1,"all"),6),"Warm-up: last week's phrases"):null,learn("a",1),meaning("a"),sayback("a"),quiz(partIds(w,"a"),8),speak(0,true)];break;

   :`<div class="row"><button class="btn primary" id="sh-post">Post to Discord</button><button class="btn" id="sh-skip">Skip</button><span class="small muted" id="sh-msg"></span></div>`}</div>${feedbackCard()}`}
function feedbackCard(){const d=discordCfg(),can=IN_CLAUDE||!!d.feedback;
  return`<div class="panel"><div class="label">Feedback on the app or this lesson</div><p class="small muted">Anything confusing, broken, missing, or an idea? It goes to the group's ${chLink("feedback")}${IN_CLAUDE?" (and straight to Claude for the next round of fixes)":""}.</p>
   <textarea id="fb-text" placeholder="e.g. The listening pause is too short on week 3 · I'd love a numbers-only drill"></textarea>
   <div class="row"><button class="btn" id="fb-send" ${can?"":"disabled"}>Send feedback</button><span class="small muted" id="fb-msg">${can?"":`Tap the setup link pinned in ${chLink("today")} to send.`}</span></div></div>`}
async function sendFeedback(text,label){const d=discordCfg(),entry={text,session:label,date:todayIso(),name:d.name||"Someone",app:IN_CLAUDE?"claude":"web"};
  const log=store.get("feedbackLog",[]);log.unshift(entry);store.set("feedbackLog",log.slice(0,50));
  let where=[];
  if(DB){try{await DB.collection("feedback").add(Object.assign({at:new Date().toISOString()},entry));where.push("Claude")}catch(e){}}
  if(d.feedback&&!IN_CLAUDE){await discordPost(d.feedback,`💬 **${entry.name}** · ${label}\n> ${text.replace(/\n+/g," ")}`,entry.name);where.push("#app-feedback")}
  if(!where.length)throw new Error("nowhere");return where}
function bindShare(el){const sh=PLAN.pending;if(!sh)return;const d=discordCfg();
  const skip=el.querySelector("#sh-skip");if(skip)skip.onclick=()=>{PLAN.pending=null;shareMsg="";savePlan();renderToday()};
  const su=el.querySelector("#sh-setup");if(su)su.onclick=()=>show("plan");

  const finish=()=>{if(win()){PLAN.wins=(PLAN.wins||0)+1}PLAN.pending=null;shareMsg="";savePlan();toast="Posted. 🎌";renderToday()};
  const cp=el.querySelector("#sh-copy");if(cp)cp.onclick=()=>{const w=win();const ni=el.querySelector("#sh-name");if(ni&&ni.value.trim()){const dd=store.get("discord",{});dd.name=ni.value.trim();store.set("discord",dd);const pf=prof();if(!pf.name){pf.name=dd.name;store.set("profile",pf)}}const text=shareText(Object.assign({},sh,{pts:sh.pts+(w?5:0)}),note(),w);const ok=()=>{cp.textContent="Copied — now paste it in #lesson-done";cp.onclick=finish};
    try{navigator.clipboard.writeText(text).then(ok,()=>{const ta=el.querySelector("#sh-note");ta.value=text;ta.select();cp.textContent="Select all and copy, then tap again";cp.onclick=finish})}catch(e){const ta=el.querySelector("#sh-note");ta.value=text;ta.select();cp.onclick=finish}};
  const fb=el.querySelector("#fb-send");if(fb)fb.onclick=async()=>{const t=el.querySelector("#fb-text").value.trim(),m=el.querySelector("#fb-msg");if(!t){m.textContent="Type something first.";return}fb.disabled=true;m.textContent="Sending…";
    try{const where=await sendFeedback(t,sh.label);m.textContent="Sent to "+where.join(" and ")+". Thank you.";el.querySelector("#fb-text").value=""}
    catch(e){fb.disabled=false;if(IN_CLAUDE){try{await navigator.clipboard.writeText(t);m.textContent="Couldn't store it here; copied to your clipboard, paste it in #app-feedback."}catch(x){m.textContent="Couldn't send it. Copy it and paste in #app-feedback."}}else m.textContent="Couldn't send. Check the #app-feedback webhook in Plan."}};
  const po=el.querySelector("#sh-post");if(po)po.onclick=async()=>{const m=el.querySelector("#sh-msg");po.disabled=true;m.textContent="Posting…";const w=win(),n=note();shareMsg=n;
    try{const text=shareText(Object.assign({},sh,{pts:sh.pts+(w?5:0)}),n,w);await discordPost(d.done,text,d.name);
      if(w&&d.wins&&n){try{await discordPost(d.wins,`🏆 **${d.name}** · ${sh.label}\n> ${n}`,d.name)}catch(e){}}
      finish()}
    catch(e){po.disabled=false;m.textContent="Couldn't post. Check the webhook in Plan → Discord group, and your connection."}}}

function startSession(opt){opt=opt||{};if(opt.revisit)return startRevisit(opt.revisit,opt.at);const s=current();if(!s)return;lessonWeek=s.w;let stages=stagesFor(s.w,s.d);if(s.d!==6)stages.push({kind:"rate",title:"How did it go?",min:0});

  const learnIds=stages.filter(x=>x.kind==="learn"&&!x.staff).flatMap(x=>x.ids);
  const off=stages[0]&&stages[0].kind==="sound"?1:0;
  player={s,stages,idx:Math.max(0,Math.min(stages.length-1,opt.at?opt.at+off:0)),done:{},group:opt.group||null,turn:0,logOnly:!!opt.logOnly,learnIds};renderToday()}
function startRevisit(s,at){lessonWeek=s.w;let stages=stagesFor(s.w,s.d).filter(x=>x.kind!=="selfcheck");stages.push({kind:"rate",title:"Done revisiting",min:0});if(!store.get("soundOK",false))stages.unshift({kind:"sound",title:"Sound check",min:1});

  player={s:Object.assign({},s,{revisit:true}),stages,idx:Math.max(0,Math.min(stages.length-1,at?at+off:0)),done:{},group:null,turn:0,logOnly:false,learnIds:stages.filter(x=>x.kind==="learn").flatMap(x=>x.ids),revisit:true};renderToday()}
function groupMul(){return player&&player.group?2:1}
function whose(){if(!player||!player.group)return"";const n=player.group[player.turn%player.group.length];player.turn++;return n}
function turnChip(text){return`<div class="toast" id="turn-chip" style="text-align:center;font-weight:700">${esc(text)}</div>`}

function renderPlayer(el){stopAll();onDialogueDone=null;const st=player.stages[player.idx],n=player.stages.length,last=player.idx===n-1;

   case"learn":body=`<div class="panel stage" id="ln-stage"></div><div class="bar"><i id="ln-bar"></i></div><div class="row" style="justify-content:center"><button class="btn" id="ln-prev" aria-label="Previous phrase">◀︎</button><button class="btn primary" id="ln-play" style="min-width:120px">Pause</button><button class="btn" id="ln-next" aria-label="Next phrase">▶︎</button></div>${ctlHTML()}<p class="small muted" style="text-align:center">Tap any piece to hear it again. ◀︎ ▶︎ move between phrases.</p>${NOSOUND}`;break;

   case"rate":{if(player.revisit){body=`<div class="panel"><p>Nice: <b>${esc(sessionTitle(player.s))}</b> again. Log it as extra practice? It keeps your streak alive and adds 5 points; your place in the course doesn't change.</p><div class="row"><button class="btn primary" data-again="1">Log it · +5 pts</button><button class="btn" data-again="0">Don't log</button></div><p class="small muted">Back to <button class="link" data-goweek="${player.s.w}">all lessons</button> or <button class="link" data-gotab="today">today</button>.</p></div>`;break}
    const names=store.get("groupNames",[]).filter(x=>x!==discordCfg().name);const nxs=PLAN.queue[PLAN.pos+1];body=`<div class="panel"><p>${player.logOnly?"Log this session as done (you did it with the group). How did it go?":"Session done. How did it go?"}</p>${nxs&&!player.logOnly?`<p class="small muted">Next time: <button class="link" data-goweek="${nxs.w}" data-goday="${nxs.d}"><b>${esc(sessionTitle(nxs))}</b></button>${nxs.d<=2&&nxs.w===player.s.w?" — it opens with a warm-up of today's phrases, then builds on them.":nxs.d===0?" — it opens with a quick recap of this week.":""}</p>`:""}${(player.group||player.logOnly)&&names.length?`<div><div class="label">Who did it with you?</div><div class="row">${names.map((x,i)=>`<label class="row small"><input type="checkbox" data-with="${i}" ${player.group?"checked":""}> ${esc(x)}</label>`).join("")}</div></div>`:""}<div class="rate"><button class="btn" data-rate="hard">Hard<small>repeat it tomorrow</small></button><button class="btn primary" data-rate="ok">OK<small>got most of it</small></button><button class="btn rail" data-rate="easy">Easy<small>move on</small></button></div></div>`;break}}
  const g=player.group;let ghint="";

  el.innerHTML=`<div class="wrap player">

/* small widgets used inside a session */
let cardFace="say";
function cardsWidget(box,n,max,onDone,dir){cardMax=max;dir=dir||store.get("cardDir","mix");let count=0,rev=false;if(!card||card.w>cardMax)pickCard();
  const face=()=>{cardFace=dir==="mix"?(Math.random()<0.5?"say":"und"):dir};face();
  function draw(){if(n<9999&&count>=n){box.innerHTML=`<div class="flash"><div class="phase">Done</div><div class="big">${n} of ${n}</div><p class="small muted">Tap <b>Next step</b>, or keep going.</p><div class="row" style="justify-content:center"><button class="btn" id="cw-more">One more</button></div></div>`;box.querySelector("#cw-more").onclick=()=>{n+=1;draw();if(cardFace==="und")sayNow(card.jp)};return}
    const boxes=store.get("boxes",{}),b=boxes[card.id]||0,und=cardFace==="und";
    const front=und?`<div class="ro" style="font-size:1.4rem;color:var(--ai)">${hl(card.ro)}</div><div class="jpw">${hl(card.jp)}</div>`:`<div class="big">${hl(card.en)}</div>`;
    const back=und?`<div class="big">${hl(card.en)}</div>`:`<div class="ro" style="font-size:1.4rem;color:var(--ai)">${hl(card.ro)}</div><div class="jpw">${hl(card.jp)}</div>`;
    box.innerHTML=`<div class="flash"><div class="small muted" style="font-variant-numeric:tabular-nums">${Math.min(count,n)} / ${n} · ${und?"Japanese → English":"English → Japanese"}</div>${front}${rev?`<div class="ans" style="border-top:1px solid var(--line);width:100%;padding-top:10px">${back}</div>`:`<div class="muted small">${und?"What does it mean?":"Say it in Japanese"}</div>`}<div class="boxes" aria-label="Level ${b} of 5">${[1,2,3,4,5].map(i=>`<i class="${i<=b?"f":""}"></i>`).join("")}</div></div>
     <div class="row" style="justify-content:center;margin-top:10px">${rev?`<button class="btn" id="cw-again">Again</button><button class="btn" id="cw-hear">Hear</button><button class="btn rail" id="cw-got">Got it</button>`:`${und?`<button class="btn" id="cw-hear">Hear</button>`:""}<button class="btn primary" id="cw-show" style="min-width:160px">Show answer</button>`}</div>`;
    const s=box.querySelector("#cw-show");if(s)s.onclick=()=>{rev=true;draw();sayNow(card.jp)};
    const h=box.querySelector("#cw-hear");if(h)h.onclick=()=>sayNow(card.jp);
    const tc=document.getElementById("turn-chip");if(tc&&!rev)tc.textContent=whose()+", you answer";
    const step=(delta)=>{const bx=store.get("boxes",{});bx[card.id]=delta>0?Math.min(5,(bx[card.id]||0)+1):Math.max(0,(bx[card.id]||0)-2);store.set("boxes",bx);count++;if(count===n)onDone();pickCard();face();rev=false;draw();if(cardFace==="und")sayNow(card.jp)};
    const g=box.querySelector("#cw-got");if(g)g.onclick=()=>step(1);const a=box.querySelector("#cw-again");if(a)a.onclick=()=>step(-1)}
  draw();if(cardFace==="und")sayNow(card.jp)}
/* tap quiz: meaning ↔ Japanese, misses come back */
function quizWidget(box,ids,n,onDone,forceDir){const items=ids.map(byId).filter(Boolean);if(items.length<2){box.innerHTML=`<div class="panel"><p class="small muted">Nothing to check yet.</p></div>`;onDone();return}
  const L=learnedIds(),poolAll=deck.filter(c=>(L.has(c.id)&&!!c.staff===!!(items[0]&&items[0].staff))||ids.includes(c.id));
  let queue=shuffle(items).slice(0,n).map(c=>({c,dir:forceDir||(c.staff?"und":Math.random()<0.5?"und":"say")})),total=queue.length,asked=0,firstRight=0,misses=[],round=1,q=null,answered=false,finished=false;
  const key=d=>d==="und"?"en":"ro";
  function options(c,dir){const k=key(dir),seen=new Set([c[k]]),out=[c];const cands=shuffle(poolAll.filter(x=>x.id!==c.id&&x.w===c.w)).concat(shuffle(poolAll.filter(x=>x.id!==c.id&&x.w!==c.w)));
    for(const x of cands){if(out.length>=3)break;if(!seen.has(x[k])){seen.add(x[k]);out.push(x)}}return shuffle(out)}
  function next(){if(!queue.length){if(misses.length&&round===1){round=2;queue=shuffle(misses).map(m=>({c:m.c,dir:m.dir}));misses=[];return next()}return finish()}q=queue.shift();q.opts=options(q.c,q.dir);answered=false;draw();if(q.dir==="und")sayNow(q.c.jp)}
  function finish(){finished=true;box.innerHTML=`<div class="flash"><div class="phase">All done</div><div class="big">${firstRight} of ${total} first try</div><p class="small muted">${firstRight===total?"Every meaning stuck. 🎌":"The ones you missed came back once, and they'll turn up again in your review cards."}</p></div>`;onDone()}
  function draw(){const und=q.dir==="und",k=key(q.dir);
    box.innerHTML=`<div class="flash" style="gap:12px"><div class="small muted" style="font-variant-numeric:tabular-nums">${asked+1} / ${total}${round===2?" · second chance":""}</div><div class="phase">${und?"What does it mean?":"Which one says it?"}</div>
      ${und?`<div class="ro" style="font-size:1.5rem;color:var(--ai)">${hl(q.c.ro)}</div><div class="jpw">${hl(q.c.jp)}</div><button class="say" id="qz-hear" aria-label="Hear it">${SPK}</button>`:`<div class="big">${hl(q.c.en)}</div>`}
      <div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-opt="${i}" ${answered?"disabled":""}>${und?hl(o.en):hl(o.ro)}${!und&&answered&&o.id===q.c.id?`<span class="sub jpw">${hl(o.jp)}</span>`:""}</button>`).join("")}</div>
      <div id="qz-fb" style="min-height:1.6em"></div></div><div class="row" style="justify-content:center;margin-top:10px"><button class="btn primary" id="qz-next" ${answered?"":"hidden"}>Next</button></div>`;
    const hb=box.querySelector("#qz-hear");if(hb)hb.onclick=()=>sayNow(q.c.jp,hb);
    const tc=document.getElementById("turn-chip");if(tc&&!answered)tc.textContent=whose()+", you pick";
    box.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>answer(q.opts[+b.dataset.opt],b));
    box.querySelector("#qz-next").onclick=()=>{asked++;next()}}
  function answer(o,btn){if(answered)return;answered=true;const right=o.id===q.c.id;asked<total&&round===1&&right&&firstRight++;
    box.querySelectorAll("[data-opt]").forEach(b=>{b.disabled=true;const oo=q.opts[+b.dataset.opt];if(oo.id===q.c.id)b.classList.add("ok");else if(b===btn)b.classList.add("bad")});
    const fb=box.querySelector("#qz-fb");fb.innerHTML=right?`<div class="pair">✓ <b>${hl(q.c.ro)}</b> = ${hl(q.c.en)}</div>`:`<div class="pair">Not quite. <b>${hl(q.c.ro)}</b> = ${hl(q.c.en)}${o.id!==q.c.id?`<br><span class="small muted">${hl(o.ro)} = ${hl(o.en)}</span>`:""}</div>`;
    if(!right){misses.push(q);const bx=store.get("boxes",{});bx[q.c.id]=Math.max(0,(bx[q.c.id]||0)-1);store.set("boxes",bx)}
    sayNow(q.c.jp);const nx=box.querySelector("#qz-next");nx.hidden=false;if(right)setTimeout(()=>{if(!answered||finished||box.querySelector("#qz-next")!==nx)return;asked++;next()},1400)}
  next()}
function buildWidget(box,n,onDone){let q=buildItem(),rev=false,count=0;
  function draw(){if(n<9999&&count>=n){box.innerHTML=`<div class="flash"><div class="phase">Done</div><div class="big">${n} of ${n}</div><p class="small muted">Tap <b>Next step</b>, or build one more.</p><div class="row" style="justify-content:center"><button class="btn" id="bw-more">One more</button></div></div>`;box.querySelector("#bw-more").onclick=()=>{n+=1;draw()};return}
    box.innerHTML=`<div class="flash"><div class="small muted" style="font-variant-numeric:tabular-nums">${Math.min(count,n)} / ${n}</div>${q?`<div class="big">${hl(q.en)}</div>${rev?`<div class="ans" style="border-top:1px solid var(--line);width:100%;padding-top:10px"><div class="ro" style="font-size:1.4rem;color:var(--ai)">${hl(q.ro)}</div><div class="jpw">${hl(q.jp)}</div></div>`:`<div class="muted small">Say it in Japanese</div>`}`:`<div class="muted">No patterns yet for this week.</div>`}</div>
    <div class="row" style="justify-content:center;margin-top:10px">${rev?`<button class="btn" id="bw-hear">Hear it again</button><button class="btn rail" id="bw-next">Next</button>`:`<button class="btn primary" id="bw-rev" style="min-width:160px" ${q?"":"disabled"}>Reveal</button><button class="btn" id="bw-skip">Skip</button></div>`}</div>`;
    const tc=document.getElementById("turn-chip");if(tc&&!rev)tc.textContent=whose()+", you build it";

   else{const h=1+Math.floor(Math.random()*12),half=Math.random()<.4;q={show:h+":"+(half?"30":"00"),k:HOURK[h]+"じ"+(half?"はん":""),r:HOURR[h]+"-ji"+(half?" han":"")}}

  next()}

function drawStage(phase,showAns){const st=document.getElementById("ls-stage");if(!st)return;const c=listenItems[listenIdx];if(!c)return;const hide=store.get("hideText",false),und=store.get("ldir","say")==="und";

async function startListen(){listening=true;const btn=document.getElementById("ls-play");if(btn)btn.textContent="Pause";

function partsHTML(p){const parts=partsOf(p[0]);if(parts.length<2&&!parts[0][1])return"";const hooks=parts.map(x=>hookFor(x[0])).filter(Boolean);return`<div class="parts">${parts.map(x=>`<button class="part" data-pjp="${esc(x[1]||p[1])}" title="${esc(x[2])}"><span class="ro">${hl(x[0])}</span><span class="r">${esc(x[2])}</span></button>`).join("")}</div>${hooks.length?`<div class="hook" style="grid-column:2;text-align:left;max-width:none;margin-top:2px">${esc(hooks[0])}</div>`:""}`}
let learnItems=[],learnIdx=0,learnOn=false,onLearnDone=null,learnPart=-1;

   ${(o.hideRo&&o.hideEn)||o.noParts?"":`<div class="parts">${parts.map((x,i)=>`<button class="part ${i===learnPart?"on":""}" data-part="${i}"><span class="ro">${hl(x[0])}</span><span class="r">${esc(x[2])}</span></button>`).join("")}</div>`}

  st.querySelectorAll("[data-part]").forEach(b=>b.onclick=()=>{const x=parts[+b.dataset.part];stopLearn();learnPart=+b.dataset.part;drawLearn("Tap ▶︎ Play to continue",{say:x[0]});sayNow(x[1]||c.jp)});
  const bar=document.getElementById("ln-bar");if(bar)bar.style.width=((learnIdx+1)/learnItems.length*100)+"%"}
function restartLearnIf(){if(learnOn){stopLearn();startLearn()}else{learnPart=-1;drawLearn("")}}
async function startLearn(){learnOn=true;const btn=document.getElementById("ln-play");if(btn)btn.textContent="Pause";
  const my=++runId;stopSpeech();await sleep(80);try{wake=await navigator.wakeLock.request("screen")}catch(e){}
  const ok=()=>my===runId&&learnOn,slow=f=>f,pause=len=>sleep(Math.min(12000,(store.get("gap",3)*900+len*120)*groupMul()));
  while(ok()){const c=learnItems[learnIdx],parts=partsOf(c.ro),multi=parts.length>1,enSay=sayable(c.en);
    if(c.staff){learnPart=-1;drawLearn("Listen: the meaning, then what they say",{say:"Just listen"});await speak(enSay,"en",1);if(!ok())return;await sleep(250);if(!ok())return;await speak(c.jp,"ja",1);if(!ok())return;await sleep(500);if(!ok())return;
      for(let i=0;i<parts.length;i++){const x=parts[i],jp=x[1]||c.jp;learnPart=i;drawLearn(multi?`Piece ${i+1} of ${parts.length} · ${x[2]}`:x[2],{say:"Listen: "+x[0]});if(!/sound it out/.test(x[2])){await speak(sayable(x[2]),"en",1);if(!ok())return;await sleep(200);if(!ok())return}await speak(jp,"ja",slow(0.8));if(!ok())return;await sleep(900);if(!ok())return}
      learnPart=-1;drawLearn("Normal speed, the way staff say it",{say:"Just listen"});await speak(c.jp,"ja",1.05);if(!ok())return;await sleep(500);if(!ok())return;await speak(c.jp,"ja",1.05);if(!ok())return;await sleep(500);if(!ok())return;
      drawLearn("What do they want?",{hideRo:true,hideEn:true,say:"Say the meaning in English"});await speak(c.jp,"ja",1.05);if(!ok())return;await pause(c.en.length/3+4);if(!ok())return;
      drawLearn("It means…",{say:c.en+(c.reply?" · you say: "+c.reply:"")});await speak(enSay,"en",1);if(!ok())return;await sleep(400);if(!ok())return;
      if(c.replyJp){drawLearn("Your reply",{say:c.reply+(c.replyEn?" = "+c.replyEn:"")});await speak(c.replyJp,"ja");if(!ok())return;await pause(c.reply.length)}else await sleep(700);if(!ok())return;
      learnIdx++;if(learnIdx>=learnItems.length){learnIdx=0;stopLearn();learnPart=-1;drawLearn("All done",{say:"Next: tap what they want."});if(onLearnDone)onLearnDone();return}continue}
    if(c.word&&!PARTS[c.ro]){learnPart=-1;drawLearn("Listen: the meaning, then the word",{say:"Just listen",noParts:true});await speak(enSay,"en",1);if(!ok())return;await sleep(200);if(!ok())return;await speak(c.jp,"ja",slow(0.85));if(!ok())return;await sleep(400);if(!ok())return;
      drawLearn(c.en,{say:"Say: "+c.ro,noParts:true});await speak(c.jp,"ja",slow(0.85));if(!ok())return;await pause(c.jp.length);if(!ok())return;
      drawLearn("Now from the English",{hideRo:true,say:"Say it in Japanese",noParts:true});await speak(enSay,"en",1);if(!ok())return;await pause(c.jp.length+2);if(!ok())return;
      drawLearn("Answer · "+c.en,{say:"Repeat after it",noParts:true});await speak(c.jp,"ja");if(!ok())return;await sleep(600);if(!ok())return;
      learnIdx++;if(learnIdx>=learnItems.length){learnIdx=0;stopLearn();learnPart=-1;drawLearn("All done",{say:"Next: hear each one and say what it means.",noParts:true});if(onLearnDone)onLearnDone();return}continue}
    learnPart=-1;drawLearn("Listen: the meaning, then the Japanese",{say:"Just listen"});await speak(enSay,"en",1);if(!ok())return;await sleep(250);if(!ok())return;await speak(c.jp,"ja");if(!ok())return;await sleep(500);if(!ok())return;
    for(let i=0;i<parts.length;i++){const x=parts[i],jp=x[1]||c.jp,sound=/sound it out/.test(x[2]),label=multi?`Piece ${i+1} of ${parts.length} · ${x[2]}`:x[2];learnPart=i;
      drawLearn(label,{say:"Say: "+x[0]});if(!sound){await speak(sayable(x[2]),"en",1);if(!ok())return;await sleep(200);if(!ok())return}await speak(jp,"ja",slow(0.8));if(!ok())return;await pause(jp.length);if(!ok())return;
      drawLearn(label,{say:"Once more: "+x[0]+(sound?"":" = "+x[2])});await speak(jp,"ja",slow(0.8));if(!ok())return;await pause(jp.length);if(!ok())return}
    learnPart=-1;
    if(multi){drawLearn("All together, slowly",{say:"Say: "+c.ro});await speak(c.jp,"ja",slow(0.75));if(!ok())return;await pause(c.jp.length);if(!ok())return}
    drawLearn("Normal speed · "+c.en,{say:"Say: "+c.ro});await speak(c.jp,"ja");if(!ok())return;await pause(c.jp.length);if(!ok())return;
    drawLearn("Now from the English",{hideRo:true,say:"Say it in Japanese"});await speak(enSay,"en",1);if(!ok())return;await pause(c.jp.length+6);if(!ok())return;
    drawLearn("Answer",{say:"Repeat after it"});await speak(c.jp,"ja");if(!ok())return;await sleep(700);if(!ok())return;
    drawLearn("And what does it mean?",{hideRo:true,hideEn:true,say:"Say the English"});await speak(c.jp,"ja");if(!ok())return;await pause(c.jp.length+4);if(!ok())return;
    drawLearn("It means…",{say:c.ro+" = "+c.en});await speak(enSay,"en",1);if(!ok())return;await sleep(700);if(!ok())return;
    learnIdx++;
    if(learnIdx>=learnItems.length){learnIdx=0;stopLearn();learnPart=-1;drawLearn("All done",{say:"Next: hear each one and say what it means."});if(onLearnDone)onLearnDone();return}}}
function stopLearn(){stopAll();learnOn=false;const btn=document.getElementById("ln-play");if(btn)btn.textContent="Play"}

/* ---------- DRIVE: audio only. One continuous recording per drive, so it keeps playing with the screen locked ---------- */
const DRIVE_BASE="audio/";
const DRK={j:ro=>"j:"+ro,s:ro=>"s:"+ro,k:ro=>"k:"+ro,e:en=>"e:"+sayable(en),c:t=>"c:"+t};
const DRP={intro:"Drive mode. Eyes on the road. Just listen, and speak out loud.",review:"Review time.",say:"Say it in Japanese.",und:"What does it mean?",staff:"Here's something staff will say to you.",want:"What do they want?",reply:"You can answer:",
  newp:"New phrase.",pieces:"Piece by piece.",slow:"All together, slowly.",normal:"Now at normal speed.",fromEn:"Now from the English.",mean:"And what does it mean?",half:"Halfway there. Nice work.",end:"That's the end of this drive. Great work!",preview:"Let's preview your next lesson.",go:"Let's go."};
let DA=null,driveAudio=null,drive=null; // DA: loaded index + files; drive: the built drive (segments, marks, url)
const dlog=()=>store.get("driveLog",{});
function driveWeekMin(){const L=dlog(),d=new Date();let s=0;for(let i=0;i<7;i++){const x=new Date(d);x.setDate(d.getDate()-i);s+=L[iso(x)]||0}return Math.round(s/60)}
async function driveLoad(names){
  if(!DA){const r=await fetch(DRIVE_BASE+"index.json",{cache:"force-cache"});if(!r.ok)throw new Error("audio index "+r.status);const meta=await r.json();
    const b=atob(meta.silence),sil=new Uint8Array(b.length);for(let i=0;i<b.length;i++)sil[i]=b.charCodeAt(i);DA={meta,files:{},sil}}
  await Promise.all((names||[]).filter(n=>!DA.files[n]).map(async n=>{const r=await fetch(DRIVE_BASE+n,{cache:"force-cache"});if(!r.ok)throw new Error(n+" "+r.status);DA.files[n]=await r.arrayBuffer()}));return DA}
const dclip=k=>DA&&DA.meta.clips[k];
const ddur=k=>{const c=dclip(k);return c?c[3]*DA.meta.frame:1.5};
function staffKnown(){const cw=curWeek(),s=new Set();deck.forEach(c=>{if(!c.staff)return;if(c.w<cw||PLAN.log.some(l=>l.w===c.w&&l.d>=4))s.add(c.id)});return s}
function drivePools(){const L=learnedIds(),S=staffKnown();const learned=deck.filter(c=>L.has(c.id)&&!c.staff),staff=deck.filter(c=>S.has(c.id));
  const cw=curWeek();let fresh=deck.filter(c=>c.w===cw&&!c.staff&&!L.has(c.id));if(!fresh.length&&cw<9)fresh=deck.filter(c=>c.w===cw+1&&!c.staff).slice(0,halfOf(cw+1));
  return{learned,staff,fresh:fresh.slice(0,6)}}
// the script: a list of {k:clipKey} | {gap:seconds} | {mark:{c,phase,show}} entries
function driveScript(mode,minutes){const P=drivePools(),g=store.get("gap",3),out=[],target=minutes*60;let t=0,nSay=0,nUnd=0,nStaff=0,half=false;
  const clip=(k,say)=>{out.push({k,say});t+=ddur(k)},gap=s=>{s=Math.max(0.3,Math.min(14,s));out.push({gap:s});t+=s},mark=(c,phase,show)=>out.push({mark:{c,phase,show}}),coach=x=>clip(DRK.c(x),[x,"en"]);
  const J=c=>[c.jp,"ja"],E=c=>[sayable(c.en),"en"];
  function sayItem(c){mark(c,"Say it in Japanese","en");if(nSay++<2)coach(DRP.say);clip(DRK.e(c.en),E(c));gap(g+ddur(DRK.j(c.ro))*1.3);
    mark(c,"Answer · repeat after her","both");clip(DRK.j(c.ro),J(c));gap(ddur(DRK.j(c.ro))+1.2);clip(DRK.j(c.ro),J(c));gap(1.2)}
  function undItem(c){mark(c,"What does it mean?","ro");if(nUnd++<2)coach(DRP.und);clip(DRK.j(c.ro),J(c));gap(g);mark(c,"It means…","both");clip(DRK.e(c.en),E(c));gap(0.5);clip(DRK.j(c.ro),J(c));gap(1.2)}
  function staffItem(c){mark(c,"Staff say… what do they want?","ro");if(nStaff++<1)coach(DRP.staff);else coach(DRP.want);clip(DRK.k(c.ro),J(c));gap(0.7);clip(DRK.k(c.ro),J(c));gap(g);
    mark(c,"It means…","both");clip(DRK.e(c.en),E(c));gap(0.6);

let talkItems=[],talkIdx=0,buildQ=null,buildRev=false,talkOnce=false,onTalkDone=null;
function buildTalkItems(){const it=QA.filter(q=>talk.only?q.w===talk.max:q.w<=talk.max);return shuffle(it.length?it:QA.filter(q=>q.w<=talk.max))}
function buildItem(){let pats=WEEKS.flatMap(w=>w.patterns||[]).filter(p=>talk.only?p.w===talk.max:p.w<=talk.max);
  if(!pats.length)pats=WEEKS.flatMap(w=>w.patterns||[]).filter(p=>p.w<=talk.max);if(!pats.length)return null;const p=pick(pats),K=knownWords();
  const choose=slot=>{const known=BANK[slot].filter(b=>K.has(b[0]));if(known.length)return pick(known);const intro=swapWords(p.w).filter(s=>s.slot===slot).map(s=>[s.ro,s.jp,s.en]);return pick(intro.length?intro:BANK[slot].slice(0,4))};
  const x=choose(p.x),y=p.y?choose(p.y):null;
  const sub=(s,k)=>s.replace("{x}","["+x[k]+"]").replace("{y}",y?"["+y[k]+"]":"");
  return{en:sub(p.en,2),ro:sub(p.ro,0),jp:sub(p.jp,1),w:p.w}}
function renderTalk(){const el=document.getElementById("v-talk"),m=talk.mode;talkOnce=false;onTalkDone=null;
  const scopeUI=`<div class="row"><div class="chips" role="group" aria-label="Up to week" style="flex:1;min-width:0">${WEEKS.map((w,i)=>`<button class="chip" data-tw="${i}" aria-pressed="${i===talk.max}">W${i+1}</button>`).join("")}</div>
    <div class="seg" role="group" aria-label="Scope"><button id="tk-only" aria-pressed="${talk.only}">This week</button><button id="tk-upto" aria-pressed="${!talk.only}">All so far</button></div></div>`;
  let body="";
  if(m==="answer"){talkItems=buildTalkItems();talkIdx=0;const gap=store.get("gap",3);
    body=`<p class="small muted">The app asks what people in Japan will actually ask you. Answer out loud in the pause, then hear one good answer.</p>${scopeUI}
     <div class="panel"><div class="ctl"><label class="small" for="tk-gap">Pause</label><input id="tk-gap" type="range" min="1" max="8" step="1" value="${gap}"><span class="small" id="tk-gapv" style="font-variant-numeric:tabular-nums">${gap}s</span></div>
      <label class="row small"><input type="checkbox" id="tk-hide" ${talk.hide?"checked":""}> Hide the question text (audio only, like a real conversation)</label></div>
     <div class="panel stage" id="tk-stage"></div><div class="bar"><i id="tk-bar"></i></div>
     <div class="row" style="justify-content:center"><button class="btn" id="tk-prev" aria-label="Previous">◀︎</button><button class="btn primary" id="tk-play" style="min-width:120px">Play</button><button class="btn" id="tk-next" aria-label="Next">▶︎</button></div>`}
  else if(m==="build"){body=`<p class="small muted">A pattern plus a swap word makes a sentence you've never rehearsed. Say it out loud, then reveal.</p>${scopeUI}<div id="bw"></div>`}
  else if(m==="chat"){body=chatBody()}
  else{const p=prof();const sel=(key,label)=>`<div class="field"><label class="small" for="pf-${key}">${label}</label><select id="pf-${key}">${BANK[key].map(b=>`<option value="${b[0]}" ${p[key]===b[0]?"selected":""}>${esc(b[2])} · ${esc(b[0])}</option>`).join("")}</select></div>`;
    body=`<p class="small muted">These fill in the drills, the questions and your introduction. ${SYNC.on?"Synced to your Claude account on every device.":"Saved on this phone only."}</p>
     <div class="panel"><div class="grid2">
      <div class="field"><label class="small" for="pf-name">Your first name</label><input type="text" id="pf-name" value="${esc(p.name)}" placeholder="Sam" autocomplete="given-name"></div>
      <div class="field"><label class="small" for="pf-nameKana">How it's said in Japanese (a guess, fix it if it sounds off)</label><input type="text" id="pf-nameKana" value="${esc(p.nameKana)}" placeholder="サム" lang="ja"></div>

  el.innerHTML=`<div class="wrap">${practiceNav()}<div><h2>Talk</h2></div>
   <div class="seg" role="group" aria-label="Mode"><button data-tm="answer" aria-pressed="${m==="answer"}">Answer questions</button><button data-tm="build" aria-pressed="${m==="build"}">Build sentences</button><button data-tm="me" aria-pressed="${m==="me"}">Your answers</button>${SAMPLE?`<button data-tm="chat" aria-pressed="${m==="chat"}">Chat with a local</button>`:""}</div>
   ${body}${VOICE_WARN}</div>`;
  bindPracticeNav(el);el.querySelectorAll("[data-tm]").forEach(b=>b.onclick=()=>{stopAll();talk.mode=b.dataset.tm;renderTalk()});
  el.querySelectorAll("[data-tw]").forEach(b=>b.onclick=()=>{stopAll();talk.max=+b.dataset.tw;renderTalk()});
  const to=el.querySelector("#tk-only");if(to){to.onclick=()=>{stopAll();talk.only=true;renderTalk()};el.querySelector("#tk-upto").onclick=()=>{stopAll();talk.only=false;renderTalk()}}
  if(m==="answer"){el.querySelector("#tk-gap").oninput=e=>{store.set("gap",+e.target.value);el.querySelector("#tk-gapv").textContent=e.target.value+"s"};
    el.querySelector("#tk-hide").onchange=e=>{talk.hide=e.target.checked;drawTalk("")};
    el.querySelector("#tk-play").onclick=()=>talking?stopTalk():startTalk();
    el.querySelector("#tk-prev").onclick=()=>{talkIdx=(talkIdx-1+talkItems.length)%talkItems.length;if(talking){stopTalk();startTalk()}else drawTalk("")};
    el.querySelector("#tk-next").onclick=()=>{talkIdx=(talkIdx+1)%talkItems.length;if(talking){stopTalk();startTalk()}else drawTalk("")};
    drawTalk("")}
  if(m==="build")buildWidget(el.querySelector("#bw"),9999,()=>{});
  if(m==="chat")bindChat(el);
  if(m==="me"){const p=prof();const g=id=>el.querySelector("#pf-"+id);
    g("name").oninput=()=>{if(p.nameAuto!==false){g("nameKana").value=kata(g("name").value)}};
    g("nameKana").oninput=()=>{p.nameAuto=false};
    g("origin").oninput=()=>{if(p.originAuto!==false){g("originKana").value=kata(g("origin").value)}};
    g("originKana").oninput=()=>{p.originAuto=false};
    const save=()=>{const np={name:g("name").value.trim(),nameKana:g("nameKana").value.trim(),nameAuto:p.nameAuto!==false,origin:g("origin").value.trim(),originKana:g("originKana").value.trim(),originAuto:p.originAuto!==false,job:g("job").value,hobby:g("hobby").value,food:g("food").value,city:g("city").value};
      if(np.name&&!np.nameKana)np.nameKana=kata(np.name);if(np.origin&&!np.originKana)np.originKana=kata(np.origin);store.set("profile",np);return np};
    g("save").onclick=()=>{save();renderTalk();const msg=document.getElementById("pf-msg");if(msg)msg.textContent="Saved."};
    g("hear").onclick=()=>{const np=save();sayNow(np.nameKana||"サム")};
    el.querySelectorAll("[data-intro]").forEach(b=>b.onclick=()=>sayNow(fill(INTRO[+b.dataset.intro][1],1),b))}
  renderVoiceWarn()}
function drawTalk(phase,showAns){const st=document.getElementById("tk-stage");if(!st)return;const it=talkItems[talkIdx];if(!it){st.innerHTML="";return}
  const q=`<div class="ro">${hl(fill(it.q[0],0))}</div><div class="en muted">${hl(fill(it.q[2],2))}</div><div class="jpw">${hl(fill(it.q[1],1))}</div>`;
  const a=`<div class="ans"><div class="small muted">One way to answer</div><div class="ro">${hl(fill(it.a[0],0))}</div><div class="en muted">${hl(fill(it.a[2],2))}</div><div class="jpw">${hl(fill(it.a[1],1))}</div></div>`;
  st.innerHTML=`<div class="small muted" style="font-variant-numeric:tabular-nums">${talkIdx+1} / ${talkItems.length} · W${it.w+1}</div><div class="phase">${phase||"&nbsp;"}</div>
   ${talk.hide&&!showAns?`<div class="muted">Listen for the question</div>`:q}${showAns?a:`<div style="opacity:.25;font-size:1.5rem">・・・</div>`}`;
  const bar=document.getElementById("tk-bar");if(bar)bar.style.width=((talkIdx+1)/talkItems.length*100)+"%"}
async function startTalk(){talking=true;const btn=document.getElementById("tk-play");if(btn)btn.textContent="Pause";
  const my=++runId;stopSpeech();await sleep(80);try{wake=await navigator.wakeLock.request("screen")}catch(e){}
  while(talking&&my===runId){const it=talkItems[talkIdx],gap=store.get("gap",3)*1000*groupMul(),qj=fill(it.q[1],1),aj=fill(it.a[1],1);
    const tc=document.getElementById("turn-chip");if(tc)tc.textContent=whose()+", you answer this one";
    drawTalk("Question");await speak(qj,"ja");if(my!==runId)return;
    drawTalk("Your answer");await sleep(gap+1500);if(my!==runId)return;
    drawTalk("One way to answer",true);await speak(aj,"ja");if(my!==runId)return;await sleep(700);if(my!==runId)return;
    drawTalk("Repeat it",true);await speak(aj,"ja");if(my!==runId)return;await sleep(gap);if(my!==runId)return;
    talkIdx=(talkIdx+1)%talkItems.length;
    if(talkOnce&&talkIdx===0){stopTalk();const st=document.getElementById("tk-stage");if(st)st.querySelector(".phase").textContent="All done";if(onTalkDone)onTalkDone();return}}}
function stopTalk(){stopAll();const btn=document.getElementById("tk-play");if(btn)btn.textContent="Play";drawTalk("")}

let card=null;
function pool(){const L=learnedIds(),cw=curWeek();const p=deck.filter(c=>!c.staff&&c.w<=cardMax&&(c.w<cw||L.has(c.id)));return p.length?p:deck.filter(c=>c.w<=cardMax)}
function eff(c,boxes){const b=boxes[c.id]||0;return PLAN.focus[c.w]?Math.max(0,b-1):b}
function pickCard(){const boxes=store.get("boxes",{}),p=pool();const min=Math.min(...p.map(c=>eff(c,boxes)));
  let cand=p.filter(c=>eff(c,boxes)<=min+(Math.random()<.25?1:0));if(card&&cand.length>1)cand=cand.filter(c=>c.id!==card.id);card=pick(cand)}

/* chat with a local */
const SCENES={restaurant:"a server at a small ramen restaurant in Tokyo",shop:"a clerk at a clothing shop",station:"a station attendant at Shinjuku Station",hotel:"a hotel front-desk clerk",chat:"a friendly local the traveler met at an izakaya who makes small talk"};
let chat={scene:"chat",turns:[],log:[],busy:false};
function chatRules(){const p=prof();return`You are helping an English-speaking beginner practice simple spoken Japanese for a trip to Japan. Scene: you are ${SCENES[chat.scene]}. Stay in character and keep it realistic. The learner writes in romaji or Japanese, sometimes mixed with English. Use very simple polite Japanese (desu/masu), one or two short sentences, and usually end with a natural question so the conversation continues. Never switch to English in your spoken reply.
Reply with ONLY a JSON object with these keys: "jp" (your reply in Japanese), "ro" (romaji of your reply), "en" (English meaning of your reply), "verdict" (one of "good", "ok", "retry" judging the learner's LAST line: good = understandable and natural enough for a tourist; ok = understandable with a small slip; retry = would not be understood, or was mostly English), "fix_ro" (the learner's last line corrected and natural, in romaji; empty if it was fine), "fix_jp" (the same in Japanese; empty if fine), "tip" (one short English sentence of feedback; empty if fine). For your very first line there is no learner line yet: use verdict "good" and empty fixes.
Learner: first name ${p.name||"Sam"}, from ${p.origin||"Colorado"}, job ${val("job",2)}, likes ${val("food",2)}, hobby ${val("hobby",2)}.`}
function chatBody(){return`<p class="small muted">Type what you'd say (romaji is fine). Claude plays the other person, answers in simple Japanese, and tells you whether to move on or try that line again. Uses your own Claude account; the first message asks you to allow it.</p>
   <div class="row"><label class="small" for="ch-scene">Scene</label><select id="ch-scene"><option value="chat">Small talk at an izakaya</option><option value="restaurant">Ordering at a restaurant</option><option value="shop">Buying something in a shop</option><option value="station">Asking at the station</option><option value="hotel">Hotel front desk</option></select><button class="btn" id="ch-new">New conversation</button></div>
   <div class="panel"><div class="chat" id="ch-log">${chat.log.length?chat.log.map(chatBubble).join(""):`<p class="small muted">Tap Start and the other person will open the conversation.</p>`}</div>
    <div class="row"><input type="text" id="ch-in" placeholder="Say something in Japanese…" style="flex:1;min-width:0" autocomplete="off" ${chat.busy?"disabled":""}><button class="btn primary" id="ch-send" ${chat.busy?"disabled":""}>${chat.log.length?"Send":"Start"}</button></div>
    <p class="small muted" id="ch-msg"></p></div>`}
function chatBubble(m,i){if(m.me)return`<div class="bub me"><div>${esc(m.text)}</div>${m.verdict?`<span class="verdict ${m.verdict}">${m.verdict==="good"?"Good, move on":m.verdict==="ok"?"OK, small fix":"Try again"}</span>`:""}${m.tip?`<div class="small">${esc(m.tip)}</div>`:""}${m.fix_ro&&m.verdict!=="good"?`<div class="small"><b>Say:</b> ${esc(m.fix_ro)}<span class="jpw"> · ${esc(m.fix_jp)}</span></div>`:""}</div>`;
  if(m.pending)return`<div class="bub"><div class="muted">Thinking…</div></div>`;
  return`<div class="bub"><div class="ro">${esc(m.ro)}</div><div class="small muted">${esc(m.en)}</div><div class="jpw">${esc(m.jp)}</div><div><button class="say" data-chs="${i}" aria-label="Hear it">${SPK}</button></div></div>`}
function bindChat(el){const sc=el.querySelector("#ch-scene");sc.value=chat.scene;sc.onchange=()=>{chat={scene:sc.value,turns:[],log:[],busy:false};renderTalk()};
  el.querySelector("#ch-new").onclick=()=>{chat={scene:chat.scene,turns:[],log:[],busy:false};renderTalk()};
  el.querySelectorAll("[data-chs]").forEach(b=>b.onclick=()=>sayNow(chat.log[+b.dataset.chs].jp,b));
  const inp=el.querySelector("#ch-in"),send=el.querySelector("#ch-send");
  const go=()=>chatSend(inp.value.trim());send.onclick=go;inp.onkeydown=e=>{if(e.key==="Enter")go()};
  const log=el.querySelector("#ch-log");log.scrollTop=log.scrollHeight}
async function chatSend(text){if(!SAMPLE||chat.busy)return;const first=chat.turns.length===0;if(!first&&!text)return;
  if(first)chat.turns.push({role:"user",content:chatRules()+"\n\nOpen the conversation with your first line."});
