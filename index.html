<body>
<title>Speak Japanese</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: single-column study app; JR station-sign header for the week, a rail line as the progress map, fixed bottom tab bar */
:root{
  --paper:#f3f5f2; --card:#ffffff; --ink:#1c2128; --muted:#5b6570; --line:#d8ddd6;
  --ai:#2b4e85; --ai-soft:#e3eaf5; --rail:#3a9447; --rail-soft:#e2f1e3; --warn:#b4472c;
  --jp:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#13161b; --card:#1b2027; --ink:#e7eaee; --muted:#9aa4af; --line:#2c333c;
  --ai:#93b3ea; --ai-soft:#1f2b40; --rail:#6cc477; --rail-soft:#1c3020; --warn:#f08b6f; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#13161b; --card:#1b2027; --ink:#e7eaee; --muted:#9aa4af; --line:#2c333c;
  --ai:#93b3ea; --ai-soft:#1f2b40; --rail:#6cc477; --rail-soft:#1c3020; --warn:#f08b6f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:16px/1.5 var(--body);padding-inline:16px;padding-block:16px calc(84px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--jp);text-wrap:balance;margin:0;line-height:1.25}
h2{font-size:1.35rem}
h3{font-size:1.05rem}
p{margin:0}
.jp{font-family:var(--jp)}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.label{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 14px;font-weight:600}
.btn.primary{background:var(--ai);border-color:var(--ai);color:var(--card)}
.btn.rail{background:var(--rail);border-color:var(--rail);color:var(--card)}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 12px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ai);color:var(--card)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-weight:600;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
select,input[type=text]{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 10px;max-width:100%;min-width:0}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field input,.field select{width:100%}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:460px){.grid2{grid-template-columns:1fr}}

/* station sign */
.sign{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sign-top{padding:16px 16px 12px;text-align:center}
.sign-top .kanji{font-family:var(--jp);font-weight:700;font-size:2rem;letter-spacing:.06em}
.sign-top .roma{font-weight:600;font-size:1.05rem}
.sign-band{background:var(--rail);color:var(--card);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;font-weight:600;font-size:.85rem;padding:6px 12px;gap:8px}
.sign-band .num{background:var(--card);color:var(--rail);border-radius:6px;padding:1px 8px;font-variant-numeric:tabular-nums}
.sign-band .r{text-align:right}
.sign-band button{background:none;border:0;color:inherit;font:inherit;padding:4px 0;cursor:pointer;text-align:left;min-width:0;line-height:1.2}
.sign-band button.num{background:var(--card);color:var(--rail);padding:1px 8px}
.sign-band button.r{text-align:right}
.sign-band button:disabled{visibility:hidden}
.sign-top{cursor:pointer}
.railmap [data-goweek]{cursor:pointer}
button.link{background:none;border:0;padding:0;margin:0;color:var(--ai);text-decoration:underline;text-underline-offset:2px;font:inherit;cursor:pointer;text-align:left;display:inline}
a.link{color:var(--ai)}
.cat{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.cat li{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.cat li:first-child{border-top:0}
.cat .dn{font-family:var(--jp);font-weight:700;color:var(--ai);font-variant-numeric:tabular-nums}
.cat li.now{background:var(--rail-soft);margin:0 -8px;padding:8px;border-radius:8px;border-top:0}
.cat li.now+li{border-top:0}
.cat li.focus{outline:2px solid var(--ai);outline-offset:-2px;border-radius:8px}
.cat .st{font-size:.8rem;color:var(--muted)}
.cat .st.done{color:var(--rail);font-weight:600}
.sched[data-goweek]{cursor:pointer}
.hints li[data-stage]{cursor:pointer}
.hints li[data-stage]:hover b{text-decoration:underline}
.railmap{overflow-x:auto}
.railmap svg{display:block;min-width:520px;width:100%;height:auto}
.countdown{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.countdown b{font-family:var(--jp);font-size:2.2rem;font-variant-numeric:tabular-nums;color:var(--ai)}

/* steps */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.step{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:start;padding:12px;border:1px solid var(--line);border-radius:8px}
.step .min{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ai);text-align:center;background:var(--ai-soft);border-radius:6px;padding:4px 0;font-size:.85rem}
.step .body{display:flex;flex-direction:column;gap:6px;min-width:0}
.done-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* phrases */
.phrases{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.phrase{display:grid;grid-template-columns:40px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.phrase:first-child{border-top:0}
.parts{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.part{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;align-items:center;line-height:1.2;min-width:0;font:inherit}
.part .ro{font-weight:700;color:var(--ai);font-size:1rem}
.part .r{font-size:.72rem;color:var(--muted)}
.part.on{border-color:var(--rail);background:var(--rail-soft)}
.phrase .parts{grid-column:2;justify-content:flex-start;margin-top:-2px}
.phrase .part{padding:3px 7px}
.phrase .part .ro{font-size:.85rem}
.nosound{text-align:left}
.opts{display:flex;flex-direction:column;gap:8px;width:100%}
.opt{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px 14px;font:inherit;font-weight:600;text-align:left;width:100%;line-height:1.3}
.opt .sub{display:block;font-weight:400;font-size:.8rem;color:var(--muted)}
.opt.ok{border-color:var(--rail);background:var(--rail-soft)}
.opt.bad{border-color:var(--warn);background:var(--card);opacity:.85}
.opt:disabled{cursor:default}
.pair{font-size:1.05rem;text-align:center}
.pair b{color:var(--ai)}
.hook{font-size:.85rem;color:var(--muted);font-style:italic;text-align:center;max-width:36ch}
#errbox{position:fixed;left:8px;right:8px;top:8px;z-index:9;background:#fff3f0;border:1px solid var(--warn);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:.85rem;display:flex;flex-direction:column;gap:6px;box-shadow:0 4px 16px rgba(0,0,0,.12)}
#errbox .row{gap:6px}
#errbox .btn{padding:4px 10px;font-size:.8rem}
.nosound summary{cursor:pointer;color:var(--muted)}
.nosound .note{margin-top:8px}
.nosound ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.ro{font-weight:600;font-size:1.1rem;line-height:1.3}
.jpw{font-family:var(--jp);font-size:.95rem;color:var(--muted)}
.nojp .jpw{display:none}
.swap{background:var(--rail-soft);border-radius:4px;padding:0 3px}
.say{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none}
.say svg{width:16px;height:16px;fill:var(--ai)}
.say.on{background:var(--ai)}
.say.on svg{fill:var(--card)}
.note{background:var(--ai-soft);border-radius:8px;padding:12px;font-size:.95rem}
.dlg{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.dlg li{display:grid;grid-template-columns:28px 1fr 36px;gap:10px;align-items:start}
.who{font-weight:700;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;background:var(--line)}
.who.B{background:var(--rail);color:var(--card)}
.dlg li.active .ro{color:var(--ai)}
.hide-en .en{display:none}
.prompts{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.words{display:flex;flex-wrap:wrap;gap:6px}
.word{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;align-items:flex-start;line-height:1.2;min-width:0}
.word .r{font-size:.75rem;color:var(--muted)}
.pat{display:grid;grid-template-columns:1fr;gap:2px;padding:8px 0;border-top:1px solid var(--line)}
.pat:first-child{border-top:0}
.pat .jp{font-size:1.1rem}

/* stage (audio drills) */
.stage{text-align:center;padding:24px 12px;display:flex;flex-direction:column;gap:8px;align-items:center;min-height:220px;justify-content:center}
.stage .en{font-size:1.15rem}
.stage .ro{font-size:1.5rem;font-weight:700;color:var(--ai)}
.stage .jpw{font-size:1rem}
.stage .ans{border-top:1px solid var(--line);width:100%;padding-top:10px;display:flex;flex-direction:column;gap:4px;align-items:center}
.phase{font-weight:700;color:var(--rail)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;width:100%}
.bar i{display:block;height:100%;background:var(--rail);width:0}
.ctl{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
input[type=range]{width:100%;accent-color:var(--ai)}

/* cards */
.flash{min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.flash .big{font-size:1.5rem;font-weight:700}
.boxes{display:flex;gap:4px}
.boxes i{width:10px;height:10px;border-radius:2px;background:var(--line)}
.boxes i.f{background:var(--rail)}

.warnbox{border:1px solid var(--warn);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:.9rem}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs button{border:0;background:transparent;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;font-weight:600;color:var(--muted)}
nav.tabs button .g{font-family:var(--jp);font-size:1.15rem;line-height:1.2}
nav.tabs button[aria-selected="true"]{color:var(--ai)}

/* session player */
.player{display:flex;flex-direction:column;gap:14px}
.player .head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.player .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--paper);padding-block:8px}
.bigbtn{font-size:1.1rem;padding:14px 18px;width:100%}
.prompt{font-size:1.35rem;font-weight:700;text-align:center;padding:18px 8px;font-family:var(--jp)}
.hints{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hints li{display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.hints li:first-child{border-top:0}
.donebadge{color:var(--rail);font-weight:700}
.quizk{font-family:var(--body);font-size:3.5rem;font-weight:700;text-align:center;line-height:1.1;font-variant-numeric:tabular-nums}
/* planner, chat, translator */
.nudge{background:var(--ai-soft);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px}
.nudge.warn{background:var(--card);border:1px solid var(--warn)}
.status{font-weight:600}
.status.bad{color:var(--warn)}
.status.good{color:var(--rail)}
.toast{background:var(--rail-soft);border:1px solid var(--rail);border-radius:8px;padding:10px 12px}
.rate{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rate .btn{padding:10px 6px;font-size:.9rem;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.2}
.rate .btn small{font-weight:400;opacity:.8;font-size:.75rem}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.check:first-child{border-top:0}
.check input{margin-top:4px;accent-color:var(--rail);width:18px;height:18px;flex:none}
.chat{display:flex;flex-direction:column;gap:8px;max-height:55vh;overflow:auto;padding:2px}
.bub{max-width:88%;padding:10px 12px;border-radius:12px;background:var(--ai-soft);display:flex;flex-direction:column;gap:3px;min-width:0}
.bub.me{align-self:flex-end;background:var(--rail-soft)}
.verdict{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:700;align-self:flex-start}
.verdict.good{background:var(--rail);color:var(--card)}
.verdict.ok{background:var(--card);color:var(--ai);border:1px solid var(--ai)}
.verdict.retry{background:var(--card);border:1px solid var(--warn);color:var(--warn)}
textarea{font:inherit;color:inherit;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 10px;width:100%;min-height:64px;resize:vertical}
.result{display:grid;grid-template-columns:1fr 36px;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.result:first-child{border-top:0}
.result .ro{color:var(--ai)}
.sched{display:grid;grid-template-columns:44px 1fr auto;gap:6px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.sched:first-child{border-top:0}
.sched .wk{font-family:var(--jp);font-weight:700;color:var(--ai);font-variant-numeric:tabular-nums}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--rail)}
input[type=time]{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 10px}
.upnext{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.upnext li{display:flex;gap:8px;align-items:baseline}
.upnext .d{font-variant-numeric:tabular-nums;color:var(--muted);min-width:4.5em;font-size:.85rem}
/* phase 2: compact countdown, one start card, hands-free player bits */
.countdown-line{margin:0;color:var(--muted);font-size:.95rem}
.countdown-line b{font-family:var(--jp);color:var(--ai);font-size:1.15rem;font-variant-numeric:tabular-nums}
.startcard{gap:10px}
details.fold{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 16px;min-width:0}
details.fold>summary{padding:14px 0;font-weight:600;min-height:44px;list-style-position:inside}
details.fold[open]{padding-bottom:16px}
details.fold[open]>summary{border-bottom:1px solid var(--line);margin-bottom:12px}
details.fold>.panel{border:0;padding:0;background:none}
.upnext .d{min-width:6.6em;white-space:nowrap}
.startcard .bigbtn{font-size:1.15rem;padding:16px 18px;line-height:1.3}
.autonext{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--rail-soft);border:1px solid var(--rail);border-radius:8px;padding:10px 12px}
.skipq{border:1px solid var(--ai);gap:8px}
.gear{border-top:1px solid var(--line);padding-top:8px}
.gear summary{cursor:pointer;color:var(--muted);font-size:.9rem;min-height:44px;display:flex;align-items:center}
.help{border:1px solid var(--line);background:var(--card);border-radius:50%;width:26px;height:26px;font-size:.8rem;font-weight:700;color:var(--muted);vertical-align:middle;cursor:pointer}
.cat li.more{opacity:.85}
details>summary{cursor:pointer}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

 {kanji:"挨拶", title:"Greetings and politeness", goal:"Be polite in every situation and handle not understanding.",

   ["A","大丈夫…ですか？","Daijoubu… desu ka?","Is… everything… OK?"],

  scene:"Morning at the hotel",
  speak:["Greet someone at 8am, 2pm and 7pm.","Get a stranger's attention, then thank them.","Ask someone to repeat slowly."]},
 {kanji:"自己紹介", title:"Introducing yourself", goal:"Say who you are, where you're from and why you're here.",
  phrases:[

  patterns:[{en:"I'm from {x}",ro:"{x} kara kimashita",jp:"{x}から来ました",x:"origin"},{en:"My job is {x}",ro:"Shigoto wa {x} desu",jp:"仕事は{x}です",x:"job"},{en:"I live in {x}",ro:"{x} ni sunde imasu",jp:"{x}に住んでいます",x:"origin"}],

 {kanji:"食事", title:"Food and ordering", goal:"Get seated, order, ask questions about the menu and pay.",

  scene:"Lost near a train station",

 {kanji:"予定", title:"Time, days and plans", goal:"Talk about when things happen and what you want to do.",
  phrases:[

   ["Kyou / Ashita / Kinou","今日 / 明日 / 昨日","Today / Tomorrow / Yesterday"],

  dialogue:[

const HOOKS={

 "yukkuri":"slowly: pair it with onegaishimasu",
 "futatsu":"two things: hitotsu, futatsu, mittsu for counting items",
 "doko":"where",
 "nani":"what (nan before desu)",

 "arimasu ka?":"'is there…?': the shop and restaurant question",
 "arimasen":"the no form of arimasu: there isn't / I don't have",
 "sumimasen":"excuse me, sorry and thanks-for-the-trouble in one word",
 "arigatou":"thanks; add gozaimasu to make it polite",

 "wakari":"wakaru = to understand",

  WEEKS.forEach((W,w)=>{
    W.phrases.forEach((p,i)=>{const t=wordTok(p[0]);(TEACH_WITH[p[0]]||[]).forEach(x=>set(x,w+"-"+i));t.forEach(x=>set(x,t.length<2?null:w+"-"+i))});       // days 1-2
    wordsFor(w).forEach(x=>wordTok(x.ro).forEach(t=>set(t,null)));                                         // day 3: taught as words
    (STAFF[w]||[]).forEach((x,k)=>{const reply=x[3]&&!x[3].startsWith("(")?x[3]:"";const one=wordTok(x[0]).length<2;wordTok(x[0]).forEach(t=>set(t,one?null:w+"-s"+k));wordTok(reply).forEach(t=>set(t,w+"-s"+k))})}); // day 5

/* ---------- errors: show them instead of failing silently ---------- */
function showError(e,where){try{const msg=(e&&e.message)||String(e),rec={msg,where:where||"",stack:((e&&e.stack)||"").split("\n").slice(0,4).join(" | "),at:new Date().toISOString(),build:typeof BUILD==="string"?BUILD:"?"};
  store.set("lastError",rec);let box=document.getElementById("errbox");if(!box){box=document.createElement("div");box.id="errbox";box.setAttribute("role","alert");document.body.appendChild(box)}
  box.innerHTML=`<div><b>Something went wrong${where?" in "+where:""}.</b> ${msg}</div><div class="row"><button class="btn" id="err-copy">Copy details</button><button class="btn" id="err-x">Dismiss</button><span class="small">Paste this into Feedback or #app-feedback.</span></div>`;
  const text=`${rec.where}: ${rec.msg} (build ${rec.build}, ${rec.at})\n${rec.stack}`;box.querySelector("#err-copy").onclick=()=>{const b=box.querySelector("#err-copy");try{navigator.clipboard.writeText(text).then(()=>b.textContent="Copied",()=>b.textContent=text)}catch(x){b.textContent=text}};
  box.querySelector("#err-x").onclick=()=>box.remove()}catch(x){}}
window.addEventListener("error",ev=>showError(ev.error||ev.message,""));window.addEventListener("unhandledrejection",ev=>showError(ev.reason,""));
const safe=(where,fn)=>function(){try{const r=fn.apply(this,arguments);if(r&&typeof r.catch==="function")r.catch(e=>showError(e,where));return r}catch(e){showError(e,where)}};

let voices=[];
const hasTTS="speechSynthesis" in window;
function loadVoices(){try{voices=speechSynthesis.getVoices()||[]}catch(e){voices=[]}}
if(hasTTS){loadVoices();speechSynthesis.onvoiceschanged=()=>{loadVoices();renderVoiceWarn()}}
function pickVoice(lang){const l=voices.filter(v=>(v.lang||"").toLowerCase().replace("_","-").startsWith(lang));return l.find(v=>v.localService)||l[0]}
const clean=t=>t.replace(/[\[\]]/g,"").replace(/ \/ /g,"、");
let rate=0.75*Math.max(0.7,Math.min(1.2,+store.get("vrate",1)||1));   // text-to-speech pace; set from Voice speed (vrate, 31-audio.js)
function speak(text,lang,r){return new Promise(res=>{
  if(!hasTTS) return setTimeout(res,Math.max(1500,text.length*120));
  const u=new SpeechSynthesisUtterance(lang==="ja"?clean(text):text.replace(/[\[\]]/g,""));
  u.lang=lang==="ja"?"ja-JP":"en-US";const v=pickVoice(lang);if(v)u.voice=v;
  const base=lang==="ja"?rate:Math.min(1,0.35+rate*0.75);u.rate=Math.max(0.3,Math.min(1.5,base*(r||1)));let done=false;const fin=()=>{if(!done){done=true;res()}};
  u.onend=fin;u.onerror=fin;try{speechSynthesis.resume();speechSynthesis.speak(u)}catch(e){fin()}
  // safety net if onend never fires: wait the expected length for this speed, then keep waiting while the voice is still talking
  const est=Math.max(3000,text.length*(lang==="ja"?420:110)/u.rate)+1500;let extra=0;
  const chk=()=>{if(done)return;let busy=false;try{busy=speechSynthesis.speaking||speechSynthesis.pending}catch(e){}if(!busy||extra>=Math.min(20000,est)){fin();return}extra+=300;setTimeout(chk,300)};setTimeout(chk,est);
})}
function stopSpeech(){try{speechSynthesis.cancel()}catch(e){}audioStop()}
// iOS needs one utterance started inside a tap before speech works from timers
let unlocked=false;
document.addEventListener("click",()=>{if(unlocked||!hasTTS)return;unlocked=true;try{const u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u)}catch(e){}},true);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function kata(s){const V="aiueo";
  s=s.toLowerCase().replace(/[^a-z\s-]/g,"").replace(/ee|ey|ie/g,"ii").replace(/oo/g,"uu").replace(/ay/g,"ei")
   .replace(/l/g,"r").replace(/v/g,"b").replace(/ph/g,"f").replace(/th/g,"s").replace(/ck/g,"kk")
   .replace(/ch(?![aiueo])/g,"k").replace(/c(?!h)(?=[ei])/g,"s").replace(/c(?!h)/g,"k").replace(/q/g,"k").replace(/x/g,"kus").replace(/y(?![aiueo])/g,"i");
  let out="",i=0;
  while(i<s.length){const c=s[i];
    if(c===" "||c==="-"){out+="・";i++;continue}
    if(V.includes(c)){if(i>0&&s[i-1]===c){out+="ー"}else out+=KT[c];i++;continue}
    const nx=s[i+1]||"";
    if(c==="n"&&!(nx&&V.includes(nx))&&nx!=="y"){out+="ン";i++;continue}
    if(nx===c&&c!=="n"){out+="ッ";i++;continue}
    let m=null;for(const len of [3,2]){const seg=s.substr(i,len);if(KT[seg]&&V.includes(seg[seg.length-1])){m=seg;break}}
    if(m){out+=KT[m];i+=m.length;continue}
    let cons=c;const two=s.substr(i,2);if(["sh","ch","ts"].includes(two))cons=two;
    const def=(cons==="t"||cons==="d")?"o":(cons==="ch"||cons==="sh"||cons==="j")?"i":"u";
    out+=KT[cons+def]||KT[cons+"u"]||"";i+=cons.length}
  return out.replace(/ンン$/,"ン").replace(/・$/,"")}

/* ---------- SPACED REVIEW: each item comes back just before you'd forget it ---------- */
// Expanding gaps in days (Pimsleur's graduated interval recall, Leitner boxes, Anki/SM-2): learned → 1 day → 3 → 7 → 14 → 30 → 60.
// Right answers push an item further out; a miss brings it back tomorrow. New items therefore get the most practice and
// well-known ones fade to an occasional check, so nothing has to be revisited by hand.
// Three guards keep the schedule honest: (1) every session has a refresher floor, so a quiet day never means no review;
// (2) when more is due than fits, the newest items go first but older ones are picked by how overdue they are, so none starve;
// (3) due dates are nudged to the quietest nearby day, so the reviews never pile up on one day.
const SRS_GAPS=[1,1,3,7,14,30,60];
const srsAll=()=>store.get("srs",{})||{};
function isoPlus(isoStr,n){const d=_dt(isoStr)||new Date();d.setDate(d.getDate()+n);return iso(d)}

const daysBetween=(a,b)=>{const x=_dt(a),y=_dt(b);return x&&y?Math.round((y-x)/864e5):0};
// spread the reviews: of the few days just before the target date, use the one with the fewest items already due
function srsPlace(target,gap,S){if(gap<3)return target;const load={};Object.values(S).forEach(r=>{load[r.due]=(load[r.due]||0)+1});
  // nothing should rest past the flight: anything that would is brought back during the last ten days before it (a final sweep, spread over those days)
  const fly=iso(TRIP),last=isoPlus(fly,-3),first=isoPlus(fly,-10);
  if(target>last&&isoPlus(todayIso(),2)<=last){let best=null,bc=1e9;for(let d=first>isoPlus(todayIso(),2)?first:isoPlus(todayIso(),2);d<=last;d=isoPlus(d,1)){if((load[d]||0)<bc){best=d;bc=load[d]||0}}return best||last}
  const win=gap>=14?3:gap>=7?2:1;let best=target,bc=load[target]||0;for(let k=1;k<=win;k++){const d=isoPlus(target,-k);if(d>todayIso()&&(load[d]||0)<bc){best=d;bc=load[d]||0}}return best}
// a right answer moves the item up a step (unless it was reviewed early, which just restarts the same gap); a miss brings it back tomorrow
function srsGrade(id,ok){const S=srsAll(),r=S[id]||{s:1},t=todayIso(),early=!!(r.due&&r.due>t);
  if(ok){if(!early)r.s=Math.min(SRS_GAPS.length-1,(r.s||1)+1);const gap=SRS_GAPS[r.s];const nd=srsPlace(isoPlus(t,gap),gap,S);r.due=early&&r.due>nd?r.due:nd}
  else{r.s=1;r.due=isoPlus(t,1)}

// extra review weight: items that would rest past tomorrow come back tomorrow instead (a Hard rating with no spare day, a skipped step)

// What to review today. cap = the most items we'll ask for; floor = the fewest (a refresher is guaranteed: if less than the floor is

function dueIds(cap,floor){const S=srsAll(),t=todayIso(),L=new Set([...learnedIds(),...staffKnown()]);
  const all=Object.keys(S).filter(id=>L.has(id)&&byId(id)),due=all.filter(id=>S[id].due<=t);

  const lvl=id=>S[id].s||1,gap=id=>Math.max(1,SRS_GAPS[lvl(id)]),late=id=>(daysBetween(S[id].due,t)+gap(id))/gap(id);   // how overdue, as a share of its own gap

  if(kind==="numbers"){if(allTen(k))for(let v=1;v<100;v++){const j=jaNum(v);out.push({show:String(v),k:j.k,r:j.r})}else DIG.concat("juu").forEach((t,v)=>{if(v&&k.num.has(t)){const j=jaNum(v);out.push({show:String(v),k:j.k,r:j.r})}})}
  else if(kind==="prices")PRICE_POOL.forEach(v=>{const j=jaNum(v),r=j.r+" en";if(numParts(r).every(t=>partOK(t,k)))out.push({show:"¥"+v.toLocaleString("en-US"),k:j.k+"えん",r})});
  else for(let h=1;h<=12;h++){if(!hourOK(h,k))continue;out.push({show:h+":00",k:HOURK[h]+"じ",r:HOURR[h]+"-ji"});if(k.num.has("han"))out.push({show:h+":30",k:HOURK[h]+"じはん",r:HOURR[h]+"-ji han"})}
  return out}
// the first time 11–99 come up: three spoken examples of how they build

function renderDrill(kind,n,onDone){const box=document.getElementById("drill");if(!box)return;let q,count=0;const name=kind==="numbers"?"Numbers drill":kind==="prices"?"Price drill":"Time drill";

  function next(){const v=pick(pool);q=Object.assign({},v);draw(false)}
  function draw(rev){if(n&&count>=n){box.innerHTML=`<div class="label">${name} · done</div><div class="flash"><div class="big">${n} of ${n}</div><p class="small muted">Tap <b>Next step</b>, or do one more.</p><div class="row" style="justify-content:center"><button class="btn" id="dr-more">One more</button></div></div>`;box.querySelector("#dr-more").onclick=()=>{n+=1;next()};return}
    box.innerHTML=`<div class="label">${name}${n?` · ${Math.min(count,n)} / ${n}`:""}</div><p class="small muted">Say it out loud, then reveal to check.</p>
    <div class="quizk">${esc(q.show)}</div>
    <div style="text-align:center;min-height:3.2em">${rev?`<div class="ro" style="font-size:1.4rem;color:var(--ai)">${esc(q.r)}</div><div class="jpw">${q.k}</div>`:""}</div>
    <div class="row" style="justify-content:center"><button class="btn primary" id="dr-rev">${rev?"Hear it again":"Reveal"}</button><button class="btn ${rev?"rail":""}" id="dr-next">Next</button></div>`;
   box.querySelector("#dr-rev").onclick=()=>{if(!rev){count++;if(n&&count===n&&onDone)onDone()}draw(true);hearNow({key:"j:"+q.r,text:q.k,lang:"ja",ro:q.r,cat:"drill"})};box.querySelector("#dr-next").onclick=()=>{if(n&&count>=n)draw(false);else next()}}
  // the demonstration plays once, the first time all of 1–10 are known
  if(kind==="numbers"&&allTen(k)&&!store.get("numDemo",false)){let i=0;const my=++runId;
    const show=(txt,ro,kana)=>{box.innerHTML=`<div class="label">${name} · how the numbers build</div><div class="flash" id="dr-demo"><div class="en">${esc(txt)}</div>${ro?`<div class="ro" style="font-size:1.4rem;color:var(--ai)">${esc(ro)}</div><div class="jpw">${esc(kana)}</div>`:""}</div><div class="row" style="justify-content:center"><button class="btn" id="dr-skipdemo">Skip the examples</button></div>`;
      box.querySelector("#dr-skipdemo").onclick=()=>{runId++;stopSpeech();store.set("numDemo",true);next()}};
    (async()=>{await sleep(80);for(const [txt,v] of NUM_DEMO){if(my!==runId)return;const j=jaNum(v);show(txt,"","");await voice({key:"c:"+txt,text:txt,lang:"en",cat:"demo"});if(my!==runId)return;
        show(txt,j.r,j.k);await voice({key:"j:"+j.r,text:j.k,lang:"ja",ro:j.r,cat:"demo"});if(my!==runId)return;await tsleep(900);if(my!==runId)return;await voice({key:"j:"+j.r,text:j.k,lang:"ja",ro:j.r,cat:"demo"});if(my!==runId)return;await tsleep(1200)}
      if(my!==runId)return;show("Now you try.","","");await voice({key:"c:Now you try.",text:"Now you try.",lang:"en",cat:"demo"});if(my!==runId)return;store.set("numDemo",true);next()})();return}
  next()}
// the keys of lines that have no recording yet but will (new words, the demonstration, every drill value): text-to-speech until recorded
function pendingLines(){const out=[],k={num:new Set(NUMW.map(x=>x[1])),tok:new Set(["sanzen","en","ku-ji","go-ji","ichi-ji"])};
  deck.filter(c=>c.num).forEach(c=>{out.push({kind:"word",key:LN.j(c).key,jp:c.say,ro:c.ro,en:c.en,where:"number word "+c.id});out.push({kind:"meaning",key:eLine(c.en).key,jp:"",ro:"",en:sayable(c.en),where:"number word "+c.id})});

// learned = phrases and words with a review record, plus staff phrases with one (Practice never offers unlearned items)

function nothingYet(){return`<div class="panel"><p style="margin:0">Nothing learned yet. Start with today's lesson on <button class="link" data-gotab="today">Today</button>; everything you learn shows up here to practise.</p></div>`}

function drawStage(phase,showAns){const st=document.getElementById("ls-stage");if(!st)return;const c=listenItems[listenIdx];if(!c)return;const hide=store.get("hideText",false),und=store.get("ldir","say")==="und";

   ${hide&&!showAns?`<div class="muted">Just listen</div>`:hide?`${prompt}<div class="ans">${ans}</div>`:`${prompt}${showAns?`<div class="ans">${ans}</div>`:`<div style="opacity:.25;font-size:1.5rem">・・・</div>`}`}`;
  const bar=document.getElementById("ls-bar");if(bar)bar.style.width=((listenIdx+1)/listenItems.length*100)+"%"}
async function startListen(){listening=true;const btn=document.getElementById("ls-play");if(btn)btn.textContent="Pause";
  const my=++runId;stopSpeech();await sleep(80);try{wake=await navigator.wakeLock.request("screen")}catch(e){}

let learnItems=[],learnIdx=0,learnOn=false,onLearnDone=null,learnPart=-1,learnWord=null;

     ${o.hideEn?`<div class="en" style="opacity:.25">・・・</div>`:`<div class="en">${hl(wd.en)}</div>`}${o.hideRo?`<div style="opacity:.25;font-size:1.5rem">・・・</div>`:`<div class="ro">${hl(wd.ro)}</div><div class="jpw">${hl(wd.jp)}</div>`}

   ${o.hideEn?`<div class="en" style="opacity:.25">・・・</div>`:`<div class="en">${hl(c.en)}</div>`}${o.hideRo?`<div style="opacity:.25;font-size:1.5rem">・・・</div>`:`<div class="ro">${hl(c.ro)}</div><div class="jpw">${hl(c.jp)}</div>`}
   ${(o.hideRo&&o.hideEn)||o.noParts?"":`<div class="parts">${parts.map((x,i)=>`<button class="part ${i===learnPart?"on":""}" data-part="${i}"><span class="ro">${hl(x[0])}</span><span class="r">${esc(x[2])}</span></button>`).join("")}</div>`}

  st.querySelectorAll("[data-part]").forEach(b=>b.onclick=()=>{const x=parts[+b.dataset.part];stopLearn();learnPart=+b.dataset.part;drawLearn("Tap ▶︎ Play to continue",{say:x[0]});hearNow(LN.s(x[0],x[1]||c.jp))});

function restartLearnIf(){if(learnOn){stopLearn();startLearn()}else{learnPart=-1;drawLearn("")}}
async function startLearn(){learnOn=true;const btn=document.getElementById("ln-play");if(btn)btn.textContent="Pause";
  const my=++runId;stopSpeech();await sleep(80);try{wake=await navigator.wakeLock.request("screen")}catch(e){}
  const ok=()=>my===runId&&learnOn;
  const say=async L=>{await voice(L);return ok()};          // play one line (recorded clip, else text-to-speech); false once stopped
  const turn=async L=>{await yourTurn(L);return ok()};      // the learner's turn: the Time to answer pause, sized to the expected answer
  const gap=async ms=>{await tsleep(ms);return ok()};
  const card=(x,label)=>{learnWord={ro:x.ro,jp:x.jp,en:x.en,label}};
  // each new word on its own (meaning → word → your turn → once more), then a quick meaning check; returns the words taught, or null if stopped.
  // Words of staff phrases are not all recorded yet: those lines are marked "staff-word" and use text-to-speech.
  const teachWords=async(nw,staff)=>{for(let k=0;k<nw.length;k++){const wd=nw[k],W=LN.w(wd),E=eLine(wd.en);if(staff){if(!clipOf(W.key))W.cat="staff-word";if(!clipOf(E.key))E.cat="staff-word"}learnWord=wd;learnPart=-1;
      drawLearn(`New word ${k+1} of ${nw.length}`,{say:"Listen"});if(!await say(E)||!await gap(300)||!await say(W)||!await gap(400))return null;
      drawLearn(`New word ${k+1} of ${nw.length}`,{say:"Say: "+wd.ro});if(!await say(W)||!await turn(W))return null;
      drawLearn(`New word ${k+1} of ${nw.length}`,{say:"Once more: "+wd.ro+" = "+wd.en});if(!await say(W)||!await turn(W))return null}
    if(nw.length>1)for(const wd of shuffle(nw)){const W=LN.w(wd),E=eLine(wd.en);if(staff){if(!clipOf(W.key))W.cat="staff-word";if(!clipOf(E.key))E.cat="staff-word"}learnWord=wd;drawLearn("What does it mean?",{hideEn:true,say:"Say the English"});if(!await say(W)||!await turn(E))return null;
      drawLearn("It means…",{say:wd.ro+" = "+wd.en});if(!await say(E)||!await gap(600))return null}
    learnWord=null;return new Set(nw.map(w=>w.ro))};
  // from the English: meaning → your turn → the answer. Pairs (Hai / Iie …) ask for one member at a time.
  const fromEnglish=async(p,label)=>{const m=membersOf(p),list=m?m.map(x=>({ro:x.ro,jp:x.jp,en:x.en,q:x.enL,a:x.ja})):[{ro:p.ro,jp:p.jp,en:p.en,q:eLine(p.en),a:LN.j(p)}];

  const recallItem=async p=>{if(p.staff){card(p,"earlier in this lesson");drawLearn("Remember this one? What do they want?",{hideEn:true,say:"Say the English"});
      if(!await say(LN.item(p))||!await turn(eLine(p.en)))return false;drawLearn("It means…",{say:p.ro+" = "+p.en});if(!await say(eLine(p.en))||!await gap(600))return false;learnWord=null;return true}
    return fromEnglish(p,"earlier in this lesson")};

  const next=async()=>{if(learnIdx>=1&&!(await recallItem(learnItems[learnIdx-1])))return false;

    learnIdx++;return true};
  while(ok()){const c=learnItems[learnIdx],parts=partsOf(c.ro),multi=parts.length>1,E=eLine(c.en),J=LN.item(c);
    if(c.staff){const reply=c.reply&&!c.reply.startsWith("(")?c.reply:"";const nw=newWordsFor(c.id,c.ro+" "+reply);const taught=await teachWords(nw,true);if(!taught)return;
      learnPart=-1;drawLearn(nw.length?"Now what staff say: the meaning, then the Japanese":"Listen: the meaning, then what they say",{say:"Just listen"});if(!await say(E)||!await gap(300)||!await say(J)||!await gap(700))return;
      for(let i=0;i<parts.length;i++){const x=parts[i],sound=/sound it out/.test(x[2]),pw=wordTok(x[0]),S=LN.s(x[0],x[1]||c.jp);if(!sound&&pw.length===1&&taught.has(pw[0]))continue;

        if(!await say(S)||!await turn(S))return}
      learnPart=-1;drawLearn("Normal speed, the way staff say it",{say:"Listen, then say it under your breath"});if(!await say(J)||!await turn(J))return;
      drawLearn("What do they want?",{hideRo:true,hideEn:true,say:"Say the meaning in English"});if(!await say(J)||!await turn(E))return;
      drawLearn("It means…",{say:c.ro+" = "+c.en});if(!await say(E)||!await gap(600))return;

const SCENES={restaurant:"a server at a small ramen restaurant in Tokyo",shop:"a clerk at a clothing shop",station:"a station attendant at Shinjuku Station",hotel:"a hotel front-desk clerk",chat:"a friendly local the traveler met at an izakaya who makes small talk"};

function chatRules(){const p=prof();return`You are helping an English-speaking beginner practice simple spoken Japanese for a trip to Japan. Scene: you are ${SCENES[chat.scene]}. Stay in character and keep it realistic. The learner writes in romaji or Japanese, sometimes mixed with English. Use very simple polite Japanese (desu/masu), one or two short sentences, and usually end with a natural question so the conversation continues. Never switch to English in your spoken reply.
Reply with ONLY a JSON object with these keys: "jp" (your reply in Japanese), "ro" (romaji of your reply), "en" (English meaning of your reply), "verdict" (one of "good", "ok", "retry" judging the learner's LAST line: good = understandable and natural enough for a tourist; ok = understandable with a small slip; retry = would not be understood, or was mostly English), "fix_ro" (the learner's last line corrected and natural, in romaji; empty if it was fine), "fix_jp" (the same in Japanese; empty if fine), "tip" (one short English sentence of feedback; empty if fine). For your very first line there is no learner line yet: use verdict "good" and empty fixes.

function chatBody(){return`<p class="small muted">Type what you'd say (romaji is fine). Claude plays the other person, answers in simple Japanese, and tells you whether to move on or try that line again. Uses your own Claude account; the first message asks you to allow it.</p>

function loadProgressCode(raw){let o;try{const t=String(raw||"").replace(/\s+/g,"");if(!t.startsWith("JP1."))throw 0;o=JSON.parse(b64d(t.slice(4)))}catch(e){return{ok:false,msg:"That isn't a progress code. Copy it again from the other device (it starts with JP1.)."}}
  if(!o||typeof o!=="object"||!o.plan||!Array.isArray(o.plan.log))return{ok:false,msg:"That code has no progress in it."};
  const r={};SHARE_KEYS.forEach(k=>{if(o[k]!==undefined)r[k]=o[k]});const before=progSnapshot(SHARE_KEYS),m=mergeProgress(before,r);
  SHARE_KEYS.forEach(k=>{if(k in m)store.set(k,m[k])});PLAN=loadPlan();setVrate(store.get("vrate",1));
  const n=(m.plan&&m.plan.log||[]).length;return{ok:true,msg:"Loaded. You now have "+n+" sessions logged"+(m.srs?" and "+Object.keys(m.srs).length+" items on the memory schedule":"")+"."}}
/* ---------- per-account sync (Claude version): last-writer-wins, but progress never goes backwards ---------- */
(async()=>{if(!IN_CLAUDE)return;let db,uid;
  try{db=await claude.use("db");const u=await claude.use("user");uid=u&&await u.id()}catch(e){return}
  if(!db||!uid)return;
  const LOCAL_ONLY=new Set(["soundOK","notified","lastError","_dev","_t","resume","seenKinds","autoNext"]),KEYS=SYNC_KEYS;
  let dev;try{dev=localStorage.getItem("jp17:_dev")}catch(e){}if(!dev){dev=Math.random().toString(36).slice(2,10);try{localStorage.setItem("jp17:_dev",dev)}catch(e){}}
  const ref=db.doc("data/users/"+uid+"/app");let timer=null,busy=false,again=false,pending=null,applying=false,lastAt=0;
  const snapshot=()=>{const k={};for(const n of KEYS){const v=store.get(n,undefined);if(v!==undefined)k[n]=v}return k};
  const score=progScore;
  const stamp=d=>{try{return new Date(d).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})}catch(e){return""}};
  // Merge a remote snapshot with what this device has. Sessions are a union, the higher course position wins,
  // card levels take the max, checklists are a union; everything else comes from whichever side is further along.
function merge(rk){return mergeProgress(snapshot(),rk)}
  async function push(){if(busy){again=true;return}busy=true;
    try{const at=Date.now();await ref.set({v:1,at,dev,keys:snapshot()});lastAt=at;SYNC.status="synced "+stamp(at)}
    catch(e){SYNC.status="sync paused, will retry";setTimeout(()=>SYNC.dirty("retry"),15000)}
    busy=false;if(again){again=false;push()}}
  function apply(d){const m=merge(d.keys||{});const before=JSON.stringify(snapshot());applying=true;for(const n of KEYS){if(n in m)store.set(n,m[n])}applying=false;
    PLAN=loadPlan();setVrate(store.get("vrate",1));practiceMode=store.get("pmode","listen");document.body.classList.toggle("nojp",!store.get("showJp",false));
    lastAt=Math.max(lastAt,d.at||0);SYNC.status="synced "+stamp(lastAt);SYNC.last=d.dev===dev?"this device":"another device at "+stamp(d.at||Date.now());
    const after=JSON.stringify(snapshot());if(JSON.stringify(d.keys||{})!==after)push();
    if(before!==after&&!player){try{VIEWS[curTab]()}catch(e){}}}
  function applyWhenIdle(){if(!pending)return;if(player||listening||talking||learnOn)return;const d=pending;pending=null;apply(d)}
  SYNC.dirty=k=>{if(applying||LOCAL_ONLY.has(k))return;clearTimeout(timer);timer=setTimeout(push,1500)};
  SYNC.on=true;SYNC.status="connecting";
  try{const snap=await ref.get(),d=snap&&snap.exists?snap.data():null;if(d&&d.keys)apply(d);else push()}catch(e){SYNC.status="sync paused, will retry"}
  try{ref.onSnapshot(sn=>{if(!sn||!sn.exists)return;const d=sn.data();if(!d||d.dev===dev||(d.at||0)<=lastAt)return;pending=d;applyWhenIdle()},()=>{SYNC.status="sync paused"})}catch(e){}
  setInterval(applyWhenIdle,3000);document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"){clearTimeout(timer);push()}else applyWhenIdle()});
  if(curTab==="plan")renderPlan()})();
</script>
