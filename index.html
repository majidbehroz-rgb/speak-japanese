    if(en===full)sc+=20;else if(en.includes(full))sc+=10;if(ro.includes(full))sc+=10;if(q.length>1&&jp.includes(q))sc+=12;
    toks.forEach(t=>{if(new RegExp("(^| )"+t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).test(en))sc+=3;else if(en.includes(t))sc+=1;if(new RegExp("(^| )"+t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).test(ro))sc+=3});

  el.querySelector("#notif").onclick=async()=>{try{const p=await Notification.requestPermission();if(p!=="granted")el.querySelector("#notif").textContent="Not allowed here. Use a phone alarm."}catch(e){el.querySelector("#notif").textContent="Not available here. Use a phone alarm."}renderPlan()};
  el.querySelector("#pl-jp").onchange=e=>{setShowJp(e.target.checked)};
  el.querySelector("#soundagain").onclick=()=>{store.set("soundOK",false);const o=el.querySelector("#appcheck-out");o.hidden=false;o.textContent="The sound check will run at the start of your next session."};
  el.querySelector("#appcheck").onclick=()=>{const o=el.querySelector("#appcheck-out");o.hidden=false;const ua=navigator.userAgent||"";const inApp=/FBAN|FBAV|Instagram|Discord|Line\/|Twitter|Snapchat/i.test(ua)||(!/Safari/i.test(ua)&&/iPhone|iPad/i.test(ua));
    const ja=voices.filter(v=>(v.lang||"").toLowerCase().startsWith("ja")).map(v=>v.name);let saved=false;try{localStorage.setItem("jp17:_t","1");saved=localStorage.getItem("jp17:_t")==="1";localStorage.removeItem("jp17:_t")}catch(e){}
    const lines=[`Build ${BUILD} · ${IN_CLAUDE?"Claude version":"web version"} · ${/iPhone|iPad/i.test(ua)?"iPhone/iPad":/Android/i.test(ua)?"Android":"desktop"}${inApp?" · inside another app's browser (open in Safari/Chrome instead)":""}`,
      `Speech: ${hasTTS?"available ✓":"NOT available ✗ — this browser can't speak"}`,`Japanese voice: ${ja.length?ja.slice(0,2).join(", ")+" ✓":voices.length?"none found ✗ — add one in the phone's settings":"voice list not loaded yet, try again after playing something"}`,
      `Saves progress: ${saved?"yes ✓":"no ✗ — private browsing? progress will be lost when you close the page"}`,`Discord: ${discordCfg().done?"connected ✓":IN_CLAUDE?"copy-and-paste mode (normal in Claude)":"not connected — tap the pinned setup link in #lesson-today"}`,`Sessions done: ${PLAN.log.filter(l=>l.key!=="rest").length} · sound check: ${store.get("soundOK",false)?"passed":"not yet"}`,`Sync: ${SYNC.on?SYNC.status+(SYNC.last?" · last change from "+SYNC.last:""):IN_CLAUDE?"off (not signed in)":"n/a (web version keeps progress on this phone)"}`,`Last error: ${(()=>{const e=store.get("lastError",null);return e?`${e.where||"?"}: ${e.msg} (build ${e.build}, ${e.at})`:"none recorded"})()}`,`Last sessions: ${PLAN.log.slice(-4).map(l=>l.date+" "+l.key+(l.rating?"/"+l.rating:"")).join(", ")||"none"}`];
    o.innerHTML=lines.map(esc).join("<br>")+`<br><button class="btn" id="appcheck-copy" style="margin-top:6px">Copy</button>`;const cb=o.querySelector("#appcheck-copy");cb.onclick=()=>{try{navigator.clipboard.writeText(lines.join("\n")).then(()=>cb.textContent="Copied",()=>cb.textContent="Select the text above and copy")}catch(e){cb.textContent="Select the text above and copy"}}};
  el.querySelector("#reset").onclick=()=>{if(!resetArmed){resetArmed=true;renderPlan();return}resetArmed=false;PLAN={queue:baseQueue(),pos:0,log:[],focus:{},lastAdjust:null};savePlan();store.set("boxes",{});store.set("cando",{});renderPlan()};
  const rn=el.querySelector("#reset-no");if(rn)rn.onclick=()=>{resetArmed=false;renderPlan()};renderVoiceWarn()}
function checkReminder(){try{if(!("Notification" in window)||Notification.permission!=="granted")return;const at=store.get("remindAt","08:00"),now=new Date(),hm=String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
  if(hm>=at&&store.get("notified","")!==todayIso()&&doneToday()===0&&current()){store.set("notified",todayIso());new Notification("Japanese: today's session is ready",{body:sessionTitle(current())+" · about 15 minutes"})}}catch(e){}}
setInterval(checkReminder,30000);

/* ---------- boot ---------- */
document.body.classList.toggle("nojp",!store.get("showJp",false));
show("today");
/* ---------- per-account sync (Claude version): last-writer-wins, but progress never goes backwards ---------- */
(async()=>{if(!IN_CLAUDE)return;let db,uid;
  try{db=await claude.use("db");const u=await claude.use("user");uid=u&&await u.id()}catch(e){return}
  if(!db||!uid)return;
  const LOCAL_ONLY=new Set(["soundOK","notified","lastError","_dev","_t"]),KEYS=["boxes","cando","discord","feedbackLog","gap","groupNames","hideEn","hideText","ldir","myPhrases","plan","pmode","profile","rate2","remindAt","showJp","driveLog","dmode","dlen"];
  let dev;try{dev=localStorage.getItem("jp17:_dev")}catch(e){}if(!dev){dev=Math.random().toString(36).slice(2,10);try{localStorage.setItem("jp17:_dev",dev)}catch(e){}}
  const ref=db.doc("data/users/"+uid+"/app");let timer=null,busy=false,again=false,pending=null,applying=false,lastAt=0;
  const snapshot=()=>{const k={};for(const n of KEYS){const v=store.get(n,undefined);if(v!==undefined)k[n]=v}return k};
  const score=k=>{const p=k&&k.plan;return p?(p.pos||0)*1000+((p.log||[]).length):-1};
  const stamp=d=>{try{return new Date(d).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})}catch(e){return""}};
  // Merge a remote snapshot with what this device has. Sessions are a union, the higher course position wins,
  // card levels take the max, checklists are a union; everything else comes from whichever side is further along.
  function merge(rk){const lk=snapshot(),out={},remoteAhead=score(rk)>=score(lk);
    for(const n of KEYS){const r=rk[n],l=lk[n];if(r===undefined){if(l!==undefined)out[n]=l;continue}if(l===undefined){out[n]=r;continue}
      if(n==="plan"){const base=remoteAhead?r:l,other=remoteAhead?l:r;const seen=new Set((base.log||[]).map(x=>x.date+"|"+x.key)),log=(base.log||[]).slice();
        (other.log||[]).forEach(x=>{const id=x.date+"|"+x.key;if(!seen.has(id)){seen.add(id);log.push(x)}});log.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
        out.plan=Object.assign({},base,{log,wins:Math.max(base.wins||0,other.wins||0),focus:Object.assign({},other.focus||{},base.focus||{})});continue}
      if(n==="boxes"){const b=Object.assign({},l);for(const k in r)b[k]=Math.max(b[k]||0,r[k]||0);out[n]=b;continue}
      if(n==="cando"){out[n]=Object.assign({},l,r);continue}
      if(n==="driveLog"){const b=Object.assign({},l);for(const k in r)b[k]=Math.max(b[k]||0,r[k]||0);out[n]=b;continue}
      if(n==="feedbackLog"||n==="myPhrases"){const seen=new Set();out[n]=[...(remoteAhead?r:l),...(remoteAhead?l:r)].filter(x=>{const id=JSON.stringify(x);if(seen.has(id))return false;seen.add(id);return true}).slice(0,50);continue}
      out[n]=remoteAhead?r:l}
    return out}
  async function push(){if(busy){again=true;return}busy=true;
    try{const at=Date.now();await ref.set({v:1,at,dev,keys:snapshot()});lastAt=at;SYNC.status="synced "+stamp(at)}
    catch(e){SYNC.status="sync paused, will retry";setTimeout(()=>SYNC.dirty("retry"),15000)}
    busy=false;if(again){again=false;push()}}
  function apply(d){const m=merge(d.keys||{});const before=JSON.stringify(snapshot());applying=true;for(const n of KEYS){if(n in m)store.set(n,m[n])}applying=false;
    PLAN=loadPlan();rate=store.get("rate2",0.75);practiceMode=store.get("pmode","listen");document.body.classList.toggle("nojp",!store.get("showJp",false));
    lastAt=Math.max(lastAt,d.at||0);SYNC.status="synced "+stamp(lastAt);SYNC.last=d.dev===dev?"this device":"another device at "+stamp(d.at||Date.now());
    const after=JSON.stringify(snapshot());if(JSON.stringify(d.keys||{})!==after)push();
    if(before!==after&&!player){try{VIEWS[curTab]()}catch(e){}}}
  function applyWhenIdle(){if(!pending)return;if(player||listening||talking||learnOn)return;const d=pending;pending=null;apply(d)}
  SYNC.dirty=k=>{if(applying||LOCAL_ONLY.has(k))return;clearTimeout(timer);timer=setTimeout(push,1500)};
  SYNC.on=true;SYNC.status="connecting";
  try{const snap=await ref.get(),d=snap&&snap.exists?snap.data():null;if(d&&d.keys)apply(d);else push()}catch(e){SYNC.status="sync paused, will retry"}
  try{ref.onSnapshot(sn=>{if(!sn||!sn.exists)return;const d=sn.data();if(!d||d.dev===dev||(d.at||0)<=lastAt)return;pending=d;applyWhenIdle()},()=>{SYNC.status="sync paused"})}catch(e){}
  setInterval(applyWhenIdle,3000);document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"){clearTimeout(timer);push()}else applyWhenIdle()});
  if(curTab==="plan")renderPlan()})();
</script>
